<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Товар — NOVA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% -10%, rgba(255,255,255,.08), transparent 35%),
                #07080a;
            color: #fff;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            height: 72px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            background: rgba(7,8,10,.78);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        nav {
            display: flex;
            gap: 28px;
            color: #999;
            font-size: 14px;
        }

        nav a:hover {
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.1);
            transition: .25s;
        }

        .action:hover {
            background: rgba(255,255,255,.1);
            transform: translateY(-2px);
        }

        .counter {
            position: absolute;
            top: -3px;
            right: -3px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 20px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: min(1200px, 90%);
            margin: auto;
            padding: 70px 0 100px;
        }

        .back {
            color: #777;
            font-size: 14px;
            margin-bottom: 35px;
            display: inline-block;
        }

        .back:hover {
            color: #fff;
        }

        .product {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        /* PRODUCT VISUAL */

        .visual {
            min-height: 620px;
            border-radius: 35px;
            background:
                radial-gradient(circle at 50% 35%, rgba(255,255,255,.12), transparent 38%),
                linear-gradient(145deg,#111318,#08090b);
            border: 1px solid rgba(255,255,255,.08);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .visual::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(255,255,255,.04);
            filter: blur(40px);
        }

        .phone {
            width: 245px;
            height: 500px;
            border-radius: 43px;
            padding: 8px;
            background: linear-gradient(145deg,#59606c,#191c22);
            border: 4px solid #3d424b;
            box-shadow:
                0 40px 80px rgba(0,0,0,.7),
                inset 0 0 0 1px rgba(255,255,255,.15);
            position: relative;
            transform: rotate(-7deg);
            z-index: 2;
        }

        .screen {
            width: 100%;
            height: 100%;
            border-radius: 34px;
            background:
                radial-gradient(circle at 50% 25%, rgba(255,255,255,.15), transparent 30%),
                linear-gradient(145deg,#1d2530,#07090c);
            position: relative;
            overflow: hidden;
        }

        .screen::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 82px;
            height: 25px;
            border-radius: 20px;
            background: #050608;
        }

        .screen-clock {
            position: absolute;
            top: 45%;
            width: 100%;
            text-align: center;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: -3px;
        }

        .screen-date {
            position: absolute;
            top: 58%;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 13px;
        }

        /* INFO */

        .badge {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 20px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.1);
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(42px,5vw,68px);
            line-height: .98;
            letter-spacing: -3px;
            margin-bottom: 22px;
        }

        .description {
            color: #999;
            line-height: 1.7;
            max-width: 540px;
            margin-bottom: 28px;
        }

        .price {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 28px;
        }

        .option-title {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .option {
            padding: 11px 15px;
            border-radius: 11px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.1);
            color: #aaa;
            cursor: pointer;
        }

        .option.active,
        .option:hover {
            color: #fff;
            border-color: rgba(255,255,255,.5);
            background: rgba(255,255,255,.08);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .cart-btn {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 17px;
            background: #fff;
            color: #000;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: .25s;
        }

        .cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255,255,255,.13);
        }

        .favorite-btn {
            width: 58px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.13);
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 23px;
            cursor: pointer;
            transition: .25s;
        }

        .favorite-btn:hover {
            background: rgba(255,255,255,.1);
        }

        .favorite-btn.active {
            color: #ff5b70;
        }

        /* SPECS */

        .specs {
            margin-top: 70px;
            padding-top: 45px;
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .specs h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 12px;
        }

        .spec {
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.07);
        }

        .spec span {
            display: block;
            color: #777;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .spec strong {
            font-size: 15px;
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translate(-50%,20px);
            background: #fff;
            color: #000;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%,0);
        }

        footer {
            padding: 35px;
            text-align: center;
            color: #666;
            border-top: 1px solid rgba(255,255,255,.07);
            font-size: 13px;
        }

        @media(max-width:850px) {

            nav {
                display: none;
            }

            .product {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .visual {
                min-height: 500px;
            }

            .phone {
                width: 200px;
                height: 410px;
            }

            .spec-grid {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media(max-width:500px) {

            main {
                width: 92%;
                padding-top: 40px;
            }

            .visual {
                min-height: 430px;
            }

            h1 {
                font-size: 43px;
            }

            .buttons {
                flex-direction: row;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">NOVA</a>

    <nav>
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="smartphones.html">Смартфоны</a>
        <a href="laptops.html">Ноутбуки</a>
        <a href="audio.html">Аудио</a>
    </nav>

    <div class="actions">

        <a href="favorites.html" class="action">
            ♡
            <span class="counter" id="favoriteCounter">0</span>
        </a>

        <a href="cart.html" class="action">
            🛒
            <span class="counter" id="cartCounter">0</span>
        </a>

    </div>

</header>


<main>

    <a href="catalog.html" class="back">
        ← Вернуться в каталог
    </a>


    <section class="product">

        <div class="visual">

            <div class="phone">

                <div class="screen">

                    <div class="screen-clock" id="clock">
                        09:41
                    </div>

                    <div class="screen-date">
                        NOVA EXPERIENCE
                    </div>

                </div>

            </div>

        </div>


        <div class="info">

            <div class="badge" id="badge">
                NOVA
            </div>

            <h1 id="productName">
                Загрузка...
            </h1>

            <p class="description" id="description">
                Загрузка...
            </p>

            <div class="price" id="price">
                0 ₽
            </div>


            <div class="option-title">
                Память
            </div>

            <div class="options" id="memoryOptions"></div>


            <div class="option-title">
                Цвет
            </div>

            <div class="options" id="colorOptions"></div>


            <div class="buttons">

                <button
                    class="cart-btn"
                    onclick="addToCart()"
                    id="cartButton">

                    Добавить в корзину

                </button>

                <button
                    class="favorite-btn"
                    onclick="toggleFavorite()"
                    id="favoriteButton">

                    ♡

                </button>

            </div>

        </div>

    </section>


    <section class="specs">

        <h2>Характеристики</h2>

        <div class="spec-grid" id="specGrid"></div>

    </section>

</main>


<footer>
    © 2026 NOVA. Premium technology store.
</footer>


<div class="toast" id="toast">
    Товар добавлен в корзину ✓
</div>


<script>

    /* =========================
       ТОВАРЫ
    ========================= */

    const products = {

        "iphone-15-pro-max": {
            name: "iPhone 15 Pro Max",
            badge: "Apple",
            description: "Флагманский смартфон с титановым корпусом и профессиональной камерой.",
            price: 1479,
            memory: ["256 GB", "512 GB", "1 TB"],
            colors: ["Titanium Black", "Titanium Blue", "Titanium Natural"],
            specs: {
                "Экран": "6.7″ OLED",
                "Частота": "120 Hz",
                "Камера": "48 MP",
                "Чип": "A17 Pro"
            }
        },

        "iphone-16-pro-max": {
            name: "iPhone 16 Pro Max",
            badge: "Apple",
            description: "Большой Pro-дисплей, мощный процессор и продвинутая система камер.",
            price: 899,
            memory: ["256 GB", "512 GB", "1 TB"],
            colors: ["Black Titanium", "Desert Titanium", "Natural Titanium"],
            specs: {
                "Экран": "6.9″ OLED",
                "Частота": "120 Hz",
                "Камера": "48 MP",
                "Чип": "A18 Pro"
            }
        },

        "iphone-17-pro-max": {
            name: "iPhone 17 Pro Max",
            badge: "NOVA NEW",
            description: "Новый уровень производительности, камеры и премиального мобильного опыта.",
            price: 1285,
            memory: ["256 GB", "512 GB", "1 TB"],
            colors: ["Black", "Silver", "Titanium"],
            specs: {
                "Экран": "6.9″ OLED",
                "Частота": "120 Hz",
                "Камера": "48 MP",
                "Чип": "A19 Pro"
            }
        },

        "iphone-18-pro": {
            name: "iPhone 18 Pro",
            badge: "NEW",
            description: "Следующее поколение Pro с максимальной производительностью и современной камерой.",
            price: 1449,
            memory: ["256 GB", "512 GB", "1 TB"],
            colors: ["Black", "Silver", "Deep Blue"],
            specs: {
                "Экран": "6.3″ OLED",
                "Частота": "120 Hz",
                "Камера": "48 MP",
                "Чип": "A20 Pro"
            }
        },

        "iphone-18-pro-max": {
            name: "iPhone 18 Pro Max",
            badge: "NEW",
            description: "Максимальный Pro-опыт NOVA: большой дисплей, мощный чип и профессиональная камера.",
            price: 1599,
            memory: ["256 GB", "512 GB", "1 TB"],
            colors: ["Black", "Silver", "Deep Blue"],
            specs: {
                "Экран": "6.9″ OLED",
                "Частота": "120 Hz",
                "Камера": "48 MP",
                "Чип": "A20 Pro"
            }
        }

    };


    /* =========================
       ID ТОВАРА
    ========================= */

    const params =
        new URLSearchParams(window.location.search);

    const productId =
        params.get("id") || "iphone-17-pro-max";

    const product =
        products[productId] || products["iphone-17-pro-max"];


    /* =========================
       ЗАПОЛНЯЕМ СТРАНИЦУ
    ========================= */

    document.title =
        product.name + " — NOVA";

    document.getElementById("productName")
        .textContent = product.name;

    document.getElementById("badge")
        .textContent = product.badge;

    document.getElementById("description")
        .textContent = product.description;

    document.getElementById("price")
        .textContent =
        product.price.toLocaleString("ru-RU") + " ₽";


    /* =========================
       ПАМЯТЬ
    ========================= */

    const memoryContainer =
        document.getElementById("memoryOptions");

    product.memory.forEach((memory,index) => {

        const button =
            document.createElement("button");

        button.className =
            "option" + (index === 0 ? " active" : "");

        button.textContent = memory;

        button.onclick = () => {

            memoryContainer
                .querySelectorAll(".option")
                .forEach(x => x.classList.remove("active"));

            button.classList.add("active");

        };

        memoryContainer.appendChild(button);

    });


    /* =========================
       ЦВЕТ
    ========================= */

    const colorContainer =
        document.getElementById("colorOptions");

    product.colors.forEach((color,index) => {

        const button =
            document.createElement("button");

        button.className =
            "option" + (index === 0 ? " active" : "");

        button.textContent = color;

        button.onclick = () => {

            colorContainer
                .querySelectorAll(".option")
                .forEach(x => x.classList.remove("active"));

            button.classList.add("active");

        };

        colorContainer.appendChild(button);

    });


    /* =========================
       ХАРАКТЕРИСТИКИ
    ========================= */

    const specGrid =
        document.getElementById("specGrid");

    Object.entries(product.specs).forEach(
        ([name,value]) => {

            const spec =
                document.createElement("div");

            spec.className = "spec";

            spec.innerHTML = `
                <span>${name}</span>
                <strong>${value}</strong>
            `;

            specGrid.appendChild(spec);

        }
    );


    /* =========================
       КОРЗИНА
    ========================= */

    let cart =
        JSON.parse(
            localStorage.getItem("novaCart") || "[]"
        );


    function normalizeCart() {

        cart = cart.map(item => {

            if (typeof item === "string") {

                return {
                    id: item,
                    quantity: 1
                };

            }

            return {
                id: item.id,
                quantity: item.quantity || 1
            };

        });

    }


    normalizeCart();


    function saveCart() {

        localStorage.setItem(
            "novaCart",
            JSON.stringify(cart)
        );

    }


    function updateCounters() {

        const cartCount =
            cart.reduce(
                (sum,item) =>
                sum + (item.quantity || 1),
                0
            );

        document.getElementById("cartCounter")
            .textContent = cartCount;


        const favorites =
            JSON.parse(
                localStorage.getItem("novaFavorites") || "[]"
            );

        document.getElementById("favoriteCounter")
            .textContent = favorites.length;

    }


    function addToCart() {

        const existing =
            cart.find(item =>
                item.id === productId
            );


        if (existing) {

            existing.quantity += 1;

        } else {

            cart.push({
                id: productId,
                quantity: 1
            });

        }


        saveCart();

        updateCounters();

        showToast();

        const button =
            document.getElementById("cartButton");

        button.textContent =
            "Добавлено ✓";


        setTimeout(() => {

            button.textContent =
                "Добавить в корзину";

        }, 1500);

    }


    /* =========================
       ИЗБРАННОЕ
    ========================= */

    let favorites =
        JSON.parse(
            localStorage.getItem("novaFavorites") || "[]"
        );


    function toggleFavorite() {

        const button =
            document.getElementById("favoriteButton");


        const index =
            favorites.indexOf(productId);


        if (index === -1) {

            favorites.push(productId);

            button.classList.add("active");

            button.textContent = "♥";

            showToast("Добавлено в избранное ♥");

        } else {

            favorites.splice(index,1);

            button.classList.remove("active");

            button.textContent = "♡";

            showToast("Удалено из избранного");

        }


        localStorage.setItem(
            "novaFavorites",
            JSON.stringify(favorites)
        );


        updateCounters();

    }


    function updateFavoriteButton() {

        const button =
            document.getElementById("favoriteButton");


        if (favorites.includes(productId)) {

            button.classList.add("active");

            button.textContent = "♥";

        }

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(message) {

        const toast =
            document.getElementById("toast");


        toast.textContent =
            message || "Товар добавлен в корзину ✓";


        toast.classList.add("show");


        setTimeout(() => {

            toast.classList.remove("show");

        }, 1800);

    }


    /* =========================
       ЧАСЫ
    ========================= */

    function updateClock() {

        const now = new Date();

        const hours =
            String(now.getHours()).padStart(2,"0");

        const minutes =
            String(now.getMinutes()).padStart(2,"0");

        document.getElementById("clock")
            .textContent =
            hours + ":" + minutes;

    }


    updateClock();

    setInterval(updateClock,1000);


    updateCounters();

    updateFavoriteButton();

</script>

</body>
</html>
