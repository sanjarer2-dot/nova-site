    <style>
        /* =========================
           LAPTOPS PAGE

        .laptops-page {
            min-height: 100vh;
            padding-top: 110px;
            padding-bottom: 80px;
        }

            width: min(1200px, calc(100% - 40px));

        .laptops-hero {

        }

        .laptops-hero .eyebrow {
            color: #888;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;

            margin-bottom: 12px;
        }

        .laptops-hero h1 {

            font-size: clamp(38px, 6vw, 68px);

            font-size: 14px;
        }

        .laptop-search input::placeholder {
            color: #777;

        .laptop-sort {

            border-radius: 14px;

            cursor: pointer;

        /* FILTERS */

        .laptop-filters {

            margin-bottom: 35px;

        .laptop-filter {

        .laptops-grid {

            transition: transform .25s ease, border-color .25s ease;
        }

        .laptop-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,.2);

        .laptop-card-image {

            align-items: center;

        /* TOAST */

        .nova-toast {

            }

                flex-direction: column;
            }

            }
        }
    </style>
</head>

</header>


<!-- =========================

<main class="laptops-page">

    <div class="laptops-container">

        <section class="laptops-hero">

            <div class="eyebrow">NOVA COLLECTION</div>

            <h1>Ноутбуки</h1>

            <p>
                Производительность, мобильность и минималистичный дизайн.
                Выбери ноутбук NOVA под свои задачи.
            </p>

        </section>


        <!-- SEARCH / SORT -->

        <div class="laptop-toolbar">

            <div class="laptop-search">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Поиск ноутбука..."
                    autocomplete="off"
                >
            </div>

            <select id="sortSelect" class="laptop-sort">
                <option value="default">Сначала рекомендуемые</option>
                <option value="priceAsc">Цена: по возрастанию</option>
                <option value="priceDesc">Цена: по убыванию</option>
                <option value="nameAsc">Название: А–Я</option>

        <div class="laptop-filters">

            <button class="laptop-filter active" data-filter="all">

<!-- TOAST -->

<div id="toast" class="nova-toast"></div>


<!-- =========================
     PRODUCTS DATA
========================= -->

<script src="products.js"></script>

<script>

    /* =========================
       CART
    ========================= */

    const CART_KEY = "novaCart";

    function readCart() {

        try {

            const data = JSON.parse(
                localStorage.getItem(CART_KEY)
            );

            if (!Array.isArray(data)) {
                return [];
            }

            return data
                .map(item => ({
                    id: String(item.id || ""),
                    quantity: Math.max(
                        1,
                        Number(item.quantity) || 1
                    )
                }))
                .filter(item => item.id);

        } catch (error) {

            console.error("Ошибка чтения корзины:", error);

            return [];
        }
    }


    function saveCart(cart) {

        localStorage.setItem(
            CART_KEY,
            JSON.stringify(cart)
        );

        updateCartCount();
    }


    function updateCartCount() {

        const cart = readCart();

        const count = cart.reduce(
            (total, item) => total + item.quantity,
            0
        );

        const counter = document.getElementById("cartCount");

        if (counter) {
            counter.textContent = count;
        }
    }


    function addToCart(productId) {

        const product = products[productId];

        if (!product) {

            console.error(
                "Товар не найден:",
                productId
            );

            showToast("Ошибка: товар не найден");

            return;
        }

        const cart = readCart();

        const existing = cart.find(
            item => item.id === productId
        );

        if (existing) {

            existing.quantity += 1;

        } else {

            cart.push({
                id: productId,
                quantity: 1
            });

        }

        saveCart(cart);

        showToast(
            `${product.name} добавлен в корзину`
        );

    }


    /* =========================
       TOAST
    ========================= */

    let toastTimer;

    function showToast(message) {

        const toast = document.getElementById("toast");

        toast.textContent = message;

        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {

            toast.classList.remove("show");

        }, 1800);
    }


    /* =========================
       LAPTOP DATA
    ========================= */

    const laptopIds = [
        "nova-book-pro-16",
        "nova-book-air",
        "nova-book-ultra"
    ];


    let currentFilter = "all";
    let currentSearch = "";


    /* =========================
       LAPTOP CARD
    ========================= */

    function createLaptopCard(id) {

        const product = products[id];

        if (!product) {
            return "";
        }

        let filterClass = "";

        if (id === "nova-book-pro-16") {
            filterClass = "pro";
        }

        if (id === "nova-book-air") {
            filterClass = "air";
        }

        if (id === "nova-book-ultra") {
            filterClass = "ultra";
        }

        const specs = Object.values(product.specs)
            .slice(0, 3)
            .map(spec => `
                <span class="laptop-spec">
                    ${spec}
                </span>
            `)
            .join("");


        return `
            <article
                class="laptop-card"
                data-id="${id}"
                data-filter="${filterClass}"
            >

                <div class="laptop-card-image">

                    <div class="css-laptop">

                        <div class="css-laptop-screen">

                            <div class="css-laptop-camera"></div>

                        </div>

                        <div class="css-laptop-base"></div>

                    </div>

                </div>


                <div class="laptop-card-content">

                    <div class="laptop-badge">
                        ${product.badge}
                    </div>

                    <h2>
                        ${product.name}
                    </h2>

                    <p class="laptop-description">
                        ${product.description}
                    </p>

                    <div class="laptop-specs">
                        ${specs}
                    </div>

                    <div class="laptop-bottom">

                        <div class="laptop-price">
                            $${product.price.toLocaleString("en-US")}
                        </div>

                        <div class="laptop-actions">

                            <button
                                class="laptop-btn laptop-btn-details"
                                data-action="details"
                                data-id="${id}"
                            >
                                Подробнее
                            </button>

                            <button
                                class="laptop-btn laptop-btn-cart"
                                data-action="cart"
                                data-id="${id}"
                            >
                                В корзину
                            </button>

                        </div>

                    </div>

                </div>

            </article>
        `;
    }


    /* =========================
       RENDER
    ========================= */

    function renderLaptops() {

        const grid =
            document.getElementById("laptopsGrid");

        const empty =
            document.getElementById("emptyState");


        let list = laptopIds
            .map(id => ({
                id,
                product: products[id]
            }))
            .filter(item => item.product);


        /* FILTER */

        if (currentFilter !== "all") {

            list = list.filter(item => {

                if (currentFilter === "pro") {
                    return item.id === "nova-book-pro-16";
                }

                if (currentFilter === "air") {
                    return item.id === "nova-book-air";
                }

                if (currentFilter === "ultra") {
                    return item.id === "nova-book-ultra";
                }

                return true;
            });

        }


        /* SEARCH */

        if (currentSearch) {

            const search =
                currentSearch.toLowerCase();

            list = list.filter(item => {

                const product = item.product;

                return (
                    product.name
                        .toLowerCase()
                        .includes(search)
                    ||
                    product.description
                        .toLowerCase()
                        .includes(search)
                    ||
                    product.badge
                        .toLowerCase()
                        .includes(search)
                );

            });

        }


        /* SORT */

        const sort =
            document.getElementById("sortSelect").value;


        if (sort === "priceAsc") {

            list.sort(
                (a, b) =>
                    a.product.price -
                    b.product.price
            );

        }


        if (sort === "priceDesc") {

            list.sort(
                (a, b) =>
                    b.product.price -
                    a.product.price
            );

        }


        if (sort === "nameAsc") {

            list.sort(
                (a, b) =>
                    a.product.name.localeCompare(
                        b.product.name,
                        "ru"
                    )
            );

        }


        /* OUTPUT */

        grid.innerHTML = list
            .map(item => createLaptopCard(item.id))
            .join("");


        if (list.length === 0) {

            empty.style.display = "block";

        } else {

            empty.style.display = "none";

        }

    }


    /* =========================
       EVENTS
    ========================= */

    document
        .getElementById("searchInput")
        .addEventListener("input", event => {

            currentSearch =
                event.target.value.trim();

            renderLaptops();

        });


    document
        .getElementById("sortSelect")
        .addEventListener("change", () => {

            renderLaptops();

        });


    document
        .querySelectorAll(".laptop-filter")
        .forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".laptop-filter")
                    .forEach(item =>
                        item.classList.remove("active")
                    );

                button.classList.add("active");

                currentFilter =
                    button.dataset.filter;

                renderLaptops();

            });

        });


    /* CARD BUTTONS */

    document
        .getElementById("laptopsGrid")
        .addEventListener("click", event => {

            const button =
                event.target.closest("button");

            if (!button) {
                return;
            }

            const id =
                button.dataset.id;

            const action =
                button.dataset.action;


            if (!id || !products[id]) {
                return;
            }


            if (action === "details") {

                window.location.href =
                    `product.html?id=${encodeURIComponent(id)}`;

                return;
            }


            if (action === "cart") {

                addToCart(id);

                button.classList.add("added");

                button.textContent =
                    "Добавлено ✓";

                setTimeout(() => {

                    button.classList.remove("added");

                    button.textContent =
                        "В корзину";

                }, 1200);

            }

        });


    /* =========================
       INIT
    ========================= */

    updateCartCount();

    renderLaptops();

</script>

</body>
</html>
