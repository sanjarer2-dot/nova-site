<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог — NOVA</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   CATALOG ONLY
   Полностью изолированные стили каталога.
===================================================== */

.catalog-page {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    font-family: Inter, Arial, sans-serif;
}

/* ================= HEADER ================= */

.catalog-page .catalog-header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 60px;

    padding: 0 4%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(5,5,5,.9);
    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.catalog-page .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 3px;
}

.catalog-page .header-nav {
    display: flex;
    gap: 23px;
}

.catalog-page .header-nav a {
    color: #666;
    font-size: 10px;
    transition: .2s;
}

.catalog-page .header-nav a:hover,
.catalog-page .header-nav a.active {
    color: #fff;
}

.catalog-page .header-actions {
    display: flex;
    gap: 7px;
}

.catalog-page .header-action {
    position: relative;

    width: 33px;
    height: 33px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #242424;
    border-radius: 9px;

    background: #101010;
    color: #fff;
}

.catalog-page .header-icon {
    font-size: 13px;
    line-height: 1;
}

.catalog-page .counter {
    position: absolute;

    top: -5px;
    right: -5px;

    min-width: 15px;
    height: 15px;

    padding: 0 3px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff;
    color: #000;

    font-size: 7px;
    font-weight: 800;
}

/* ================= HERO ================= */

.catalog-page .catalog-hero {
    padding: 50px 20px 32px;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 0,
            rgba(255,255,255,.065),
            transparent 45%
        );
}

.catalog-page .hero-label {
    display: inline-block;

    margin-bottom: 10px;
    padding: 4px 9px;

    border: 1px solid #222;
    border-radius: 20px;

    color: #555;

    font-size: 7px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.catalog-page .catalog-hero h1 {
    margin: 0;

    font-size: clamp(30px,4vw,44px);
    line-height: 1;
    letter-spacing: -2px;
}

.catalog-page .catalog-hero p {
    max-width: 440px;

    margin: 11px auto 0;

    color: #5c5c5c;

    font-size: 9px;
    line-height: 1.5;
}

/* ================= CATEGORIES ================= */

.catalog-page .category-section {
    padding: 0 4% 22px;
}

.catalog-page .category-list {
    display: flex;
    gap: 6px;

    overflow-x: auto;

    scrollbar-width: none;
}

.catalog-page .category-list::-webkit-scrollbar {
    display: none;
}

.catalog-page .category-btn {
    flex-shrink: 0;

    padding: 6px 11px;

    border: 1px solid #222;
    border-radius: 20px;

    background: #0c0c0c;

    color: #666;

    font-size: 8px;
}

.catalog-page .category-btn.active {
    background: #fff;
    color: #000;
    border-color: #fff;
}

/* ================= LAYOUT ================= */

.catalog-page .catalog-layout {
    max-width: 1450px;

    margin: 0 auto;

    padding: 0 4% 60px;

    display: grid;
    grid-template-columns: 165px minmax(0,1fr);

    gap: 18px;
}

/* ================= FILTERS ================= */

.catalog-page .filters {
    align-self: start;

    position: sticky;
    top: 75px;

    padding: 13px;

    border: 1px solid #1d1d1d;
    border-radius: 13px;

    background: #0a0a0a;
}

.catalog-page .filters h3 {
    margin-bottom: 12px;

    font-size: 11px;
}

.catalog-page .filter-group {
    padding: 10px 0;

    border-top: 1px solid #181818;
}

.catalog-page .filter-group:first-of-type {
    border-top: 0;
}

.catalog-page .filter-title {
    margin-bottom: 7px;

    color: #444;

    font-size: 7px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.catalog-page .filter-option {
    display: flex;
    align-items: center;
    gap: 5px;

    margin: 5px 0;

    color: #666;

    font-size: 8px;
}

.catalog-page .filter-option input {
    width: 10px;
    height: 10px;

    margin: 0;

    accent-color: #fff;
}

/* ================= TOOLBAR ================= */

.catalog-page .catalog-toolbar {
    display: flex;
    gap: 6px;

    margin-bottom: 7px;
}

.catalog-page .search-box {
    flex: 1;
}

.catalog-page .search-box input {
    width: 100%;
    height: 33px;

    padding: 0 10px;

    outline: none;

    border: 1px solid #1d1d1d;
    border-radius: 8px;

    background: #0c0c0c;
    color: #fff;

    font-size: 8px;
}

.catalog-page .search-box input::placeholder {
    color: #444;
}

.catalog-page .sort-select {
    width: 140px;
    height: 33px;

    padding: 0 8px;

    outline: none;

    border: 1px solid #1d1d1d;
    border-radius: 8px;

    background: #0c0c0c;
    color: #fff;

    font-size: 8px;
}

.catalog-page .result-count {
    margin-bottom: 8px;

    color: #414141;

    font-size: 7px;
}

/* ================= GRID ================= */

.catalog-page .products-grid {
    display: grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap: 9px;
}

/* ================= CARD ================= */

.catalog-page .product-card {
    min-width: 0;

    overflow: hidden;

    border: 1px solid #1b1b1b;
    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #101010,
            #090909
        );

    transition:
        transform .2s,
        border-color .2s;
}

.catalog-page .product-card:hover {
    transform: translateY(-2px);
    border-color: #303030;
}

/* ================= VISUAL ================= */

.catalog-page .product-image {
    position: relative;

    height: 160px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.04),
            transparent 65%
        );
}

.catalog-page .product-visual-link {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* ================= BADGE ================= */

.catalog-page .product-badge {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 10;

    padding: 3px 5px;

    border-radius: 4px;

    background: #171717;

    color: #666;

    font-size: 5px;
    font-weight: 700;
}

/* ================= FAVORITE ================= */

.catalog-page .favorite-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 20;

    width: 24px;
    height: 24px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #252525;
    border-radius: 50%;

    background: rgba(0,0,0,.55);

    color: #555;

    font-family: Arial,sans-serif;
    font-size: 11px;
    font-weight: 400;

    line-height: 1;

    appearance: none;
    -webkit-appearance: none;
}

.catalog-page .favorite-btn.active {
    color: #fff;
}

/* ================= PHONE ================= */

.catalog-page .device {
    position: relative;

    width: 61px;
    height: 122px;

    border: 3px solid #252525;
    border-radius: 14px;

    background: linear-gradient(145deg,#202020,#080808);

    box-shadow: 0 15px 28px rgba(0,0,0,.5);
}

.catalog-page .device::before {
    content: "";

    position: absolute;

    top: 5px;
    left: 50%;

    width: 25px;
    height: 6px;

    border-radius: 10px;

    background: #000;

    transform: translateX(-50%);
}

.catalog-page .device::after {
    content: "NOVA";

    position: absolute;

    bottom: 8px;
    left: 50%;

    transform: translateX(-50%);

    color: #444;

    font-size: 4px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ================= LAPTOP ================= */

.catalog-page .laptop {
    position: relative;

    width: 130px;
    height: 78px;

    border: 4px solid #252525;
    border-radius: 8px 8px 3px 3px;

    background: linear-gradient(145deg,#202020,#080808);

    box-shadow: 0 15px 28px rgba(0,0,0,.5);
}

.catalog-page .laptop::after {
    content: "";

    position: absolute;

    left: -13px;
    bottom: -11px;

    width: 150px;
    height: 5px;

    border-radius: 0 0 8px 8px;

    background: #282828;
}

/* ================= TABLET ================= */

.catalog-page .tablet {
    position: relative;

    width: 90px;
    height: 120px;

    border: 4px solid #252525;
    border-radius: 12px;

    background: linear-gradient(145deg,#202020,#080808);

    box-shadow: 0 15px 28px rgba(0,0,0,.5);
}

.catalog-page .tablet::before {
    content: "";

    position: absolute;

    top: 5px;
    left: 50%;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #444;

    transform: translateX(-50%);
}

/* ================= AUDIO ================= */

.catalog-page .buds {
    position: relative;

    width: 88px;
    height: 60px;
}

.catalog-page .buds::before,
.catalog-page .buds::after {
    content: "";

    position: absolute;

    top: 6px;

    width: 34px;
    height: 45px;

    border-radius: 20px;

    background: linear-gradient(145deg,#292929,#080808);

    box-shadow: 0 12px 25px rgba(0,0,0,.5);
}

.catalog-page .buds::before {
    left: 7px;
    transform: rotate(-10deg);
}

.catalog-page .buds::after {
    right: 7px;
    transform: rotate(10deg);
}

/* ================= WATCH ================= */

.catalog-page .watch {
    position: relative;

    width: 72px;
    height: 92px;
}

.catalog-page .watch::before {
    content: "";

    position: absolute;

    left: 18px;

    width: 36px;
    height: 92px;

    border-radius: 18px;

    background: #171717;
}

.catalog-page .watch::after {
    content: "";

    position: absolute;

    left: 22px;
    top: 20px;

    width: 28px;
    height: 39px;

    border: 2px solid #2b2b2b;
    border-radius: 7px;

    background: #050505;
}

/* ================= ACCESSORY ================= */

.catalog-page .accessory {
    position: relative;

    width: 95px;
    height: 58px;

    border-radius: 14px;

    background: linear-gradient(145deg,#252525,#080808);

    box-shadow: 0 15px 28px rgba(0,0,0,.5);
}

.catalog-page .accessory::after {
    content: "NOVA";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    color: #444;

    font-size: 6px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ================= TEXT ================= */

.catalog-page .product-info {
    padding: 9px;
}

.catalog-page .product-brand {
    margin-bottom: 2px;

    color: #454545;

    font-size: 5px;
    letter-spacing: .8px;
    text-transform: uppercase;
}

.catalog-page .product-name {
    min-height: 22px;

    margin: 0;

    color: #fff;

    font-size: 9px;
    font-weight: 600;

    line-height: 1.2;
}

.catalog-page .product-description {
    min-height: 22px;

    margin: 4px 0 6px;

    color: #555;

    font-size: 6px;
    line-height: 1.35;
}

.catalog-page .product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 4px;
}

.catalog-page .product-price {
    margin: 0;

    color: #fff;

    font-size: 10px;
    font-weight: 700;

    white-space: nowrap;
}

.catalog-page .add-cart {
    padding: 5px 7px;

    border: 0;
    border-radius: 6px;

    background: #fff;
    color: #000;

    font-size: 7px;
    font-weight: 700;

    white-space: nowrap;
}

.catalog-page .details-link {
    display: inline-block;

    margin-top: 4px;

    color: #444;

    font-size: 6px;
}

.catalog-page .details-link:hover {
    color: #fff;
}

/* ================= EMPTY ================= */

.catalog-page .empty-products {
    display: none;

    padding: 50px 15px;

    border: 1px solid #1c1c1c;
    border-radius: 13px;

    text-align: center;
}

.catalog-page .empty-products h3 {
    margin-bottom: 5px;

    font-size: 13px;
}

.catalog-page .empty-products p {
    color: #555;
    font-size: 8px;
}

/* ================= CART ================= */

.catalog-page .cart-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;

    display: none;

    background: rgba(0,0,0,.6);

    backdrop-filter: blur(4px);
}

.catalog-page .cart-overlay.open {
    display: block;
}

.catalog-page .cart-panel {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 2001;

    width: min(350px,100%);
    height: 100vh;

    padding: 18px;

    display: flex;
    flex-direction: column;

    background: #0b0b0b;

    border-left: 1px solid #222;

    transform: translateX(100%);

    transition: .3s;
}

.catalog-page .cart-panel.open {
    transform: translateX(0);
}

.catalog-page .cart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 14px;
}

.catalog-page .cart-head h2 {
    font-size: 17px;
}

.catalog-page .close-cart {
    width: 29px;
    height: 29px;

    padding: 0;

    border: 1px solid #292929;
    border-radius: 50%;

    background: #111;
    color: #fff;

    font-size: 15px;
}

.catalog-page .cart-items {
    flex: 1;
    overflow-y: auto;
}

.catalog-page .cart-item {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 11px 0;

    border-bottom: 1px solid #181818;
}

.catalog-page .cart-item-info {
    flex: 1;
    min-width: 0;
}

.catalog-page .cart-item-name {
    margin-bottom: 3px;

    overflow: hidden;

    color: #fff;

    font-size: 9px;
    font-weight: 600;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.catalog-page .cart-item-price {
    color: #555;
    font-size: 8px;
}

.catalog-page .cart-quantity {
    display: flex;
    align-items: center;
    gap: 4px;
}

.catalog-page .cart-quantity button {
    width: 22px;
    height: 22px;

    padding: 0;

    border: 1px solid #222;
    border-radius: 5px;

    background: #111;
    color: #fff;
}

.catalog-page .cart-quantity span {
    min-width: 12px;

    text-align: center;

    font-size: 8px;
}

.catalog-page .remove-item {
    width: 20px;
    height: 20px;

    padding: 0;

    border: 0;

    background: transparent;
    color: #555;

    font-size: 14px;
}

.catalog-page .empty-cart {
    padding: 40px 0;

    color: #555;

    text-align: center;

    font-size: 9px;
}

.catalog-page .cart-footer {
    padding-top: 14px;

    border-top: 1px solid #1c1c1c;
}

.catalog-page .cart-total {
    display: flex;
    justify-content: space-between;

    margin-bottom: 10px;

    font-size: 12px;
    font-weight: 700;
}

.catalog-page .open-cart-btn {
    width: 100%;

    padding: 10px;

    border: 0;
    border-radius: 8px;

    background: #fff;
    color: #000;

    font-size: 8px;
    font-weight: 700;
}

/* ================= TOAST ================= */

.catalog-page .toast {
    position: fixed;

    left: 50%;
    bottom: 18px;

    z-index: 3000;

    padding: 8px 12px;

    border: 1px solid #292929;
    border-radius: 8px;

    background: #151515;
    color: #fff;

    font-size: 8px;

    transform: translate(-50%,60px);

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.catalog-page .toast.show {
    transform: translate(-50%,0);
    opacity: 1;
}

/* ================= FOOTER ================= */

.catalog-page footer {
    padding: 30px 5%;

    border-top: 1px solid #171717;

    color: #444;

    text-align: center;

    font-size: 7px;
}

/* ================= RESPONSIVE ================= */

@media (max-width:1100px) {

    .catalog-page .products-grid {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }
}

@media (max-width:800px) {

    .catalog-page .header-nav {
        display: none;
    }

    .catalog-page .catalog-layout {
        grid-template-columns: 1fr;
    }

    .catalog-page .filters {
        position: static;
    }

    .catalog-page .products-grid {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }
}

@media (max-width:600px) {

    .catalog-page .catalog-header {
        padding: 0 15px;
    }

    .catalog-page .category-section,
    .catalog-page .catalog-layout {
        padding-left: 15px;
        padding-right: 15px;
    }

    .catalog-page .products-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap: 7px;
    }

    .catalog-page .product-image {
        height: 145px;
    }

    .catalog-page .product-name {
        font-size: 8px;
    }

    .catalog-page .product-description {
        font-size: 6px;
    }

    .catalog-page .product-price {
        font-size: 9px;
    }
}

</style>
</head>

<body>

<div class="catalog-page">

<header class="catalog-header">

    <a href="index.html" class="logo">
        NOVA
    </a>

    <nav class="header-nav">

        <a href="index.html">
            Главная
        </a>

        <a href="catalog.html" class="active">
            Каталог
        </a>

        <a href="about.html">
            О нас
        </a>

        <a href="contacts.html">
            Контакты
        </a>

    </nav>

    <div class="header-actions">

        <button
            class="header-action"
            id="favoritesButton"
            type="button"
        >
            <span class="header-icon">♡</span>
            <span
                class="counter"
                id="favoritesCount"
            >0</span>
        </button>

        <button
            class="header-action"
            id="cartButton"
            type="button"
        >
            <span class="header-icon">🛒</span>
            <span
                class="counter"
                id="cartCount"
            >0</span>
        </button>

    </div>

</header>


<section class="catalog-hero">

    <div class="hero-label">
        NOVA Store
    </div>

    <h1>Каталог</h1>

    <p>
        Техника нового поколения.
        Выбирай устройство, которое подходит именно тебе.
    </p>

</section>


<section class="category-section">

    <div class="category-list">

        <button
            class="category-btn active"
            data-category="all"
            type="button"
        >
            Все товары
        </button>

        <button
            class="category-btn"
            data-category="smartphone"
            type="button"
        >
            Смартфоны
        </button>

        <button
            class="category-btn"
            data-category="laptop"
            type="button"
        >
            Ноутбуки
        </button>

        <button
            class="category-btn"
            data-category="tablet"
            type="button"
        >
            Планшеты
        </button>

        <button
            class="category-btn"
            data-category="audio"
            type="button"
        >
            Аудио
        </button>

        <button
            class="category-btn"
            data-category="watch"
            type="button"
        >
            Часы
        </button>

        <button
            class="category-btn"
            data-category="accessory"
            type="button"
        >
            Аксессуары
        </button>

    </div>

</section>


<main class="catalog-layout">

<aside class="filters">

    <h3>Фильтры</h3>

    <div class="filter-group">

        <div class="filter-title">
            Цена
        </div>

        <label class="filter-option">
            <input
                type="checkbox"
                class="price-filter"
                data-min="0"
                data-max="49999"
            >
            До 50 000 ₽
        </label>

        <label class="filter-option">
            <input
                type="checkbox"
                class="price-filter"
                data-min="50000"
                data-max="100000"
            >
            50 000 — 100 000 ₽
        </label>

        <label class="filter-option">
            <input
                type="checkbox"
                class="price-filter"
                data-min="100001"
                data-max="Infinity"
            >
            От 100 001 ₽
        </label>

    </div>

    <div class="filter-group">

        <div class="filter-title">
            Особое
        </div>

        <label class="filter-option">
            <input
                type="checkbox"
                id="newFilter"
            >
            Новинки
        </label>

        <label class="filter-option">
            <input
                type="checkbox"
                id="bestFilter"
            >
            Бестселлеры
        </label>

    </div>

    <div class="filter-group">

        <label class="filter-option">
            <input
                type="checkbox"
                id="stockFilter"
                checked
            >
            В наличии
        </label>

    </div>

</aside>


<section class="catalog-main">

    <div class="catalog-toolbar">

        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="Поиск по каталогу..."
                autocomplete="off"
            >

        </div>

        <select
            id="sortSelect"
            class="sort-select"
        >

            <option value="default">
                По умолчанию
            </option>

            <option value="price-asc">
                Цена: по возрастанию
            </option>

            <option value="price-desc">
                Цена: по убыванию
            </option>

            <option value="name-asc">
                Название: А–Я
            </option>

            <option value="name-desc">
                Название: Я–А
            </option>

        </select>

    </div>

    <div
        class="result-count"
        id="resultCount"
    >
        Товаров: 0
    </div>

    <div
        class="products-grid"
        id="productsGrid"
    ></div>

    <div
        class="empty-products"
        id="emptyProducts"
    >

        <h3>Ничего не найдено</h3>

        <p>
            Попробуй изменить запрос или фильтры.
        </p>

    </div>

</section>

</main>


<!-- CART -->

<div
    class="cart-overlay"
    id="cartOverlay"
></div>

<aside
    class="cart-panel"
    id="cartPanel"
>

    <div class="cart-head">

        <h2>Корзина</h2>

        <button
            class="close-cart"
            id="closeCart"
            type="button"
        >
            ×
        </button>

    </div>

    <div
        class="cart-items"
        id="cartItems"
    ></div>

    <div class="cart-footer">

        <div class="cart-total">

            <span>Итого</span>

            <span id="cartTotal">
                0 ₽
            </span>

        </div>

        <a href="cart.html">
            <button
                class="open-cart-btn"
                type="button"
            >
                Перейти в корзину
            </button>
        </a>

    </div>

</aside>


<div
    class="toast"
    id="toast"
></div>


<footer>
    © 2026 NOVA. Техника. Без компромиссов.
</footer>

</div>


<script src="products.js"></script>

<script>

/* =====================================================
   NOVA CATALOG
===================================================== */

const productsGrid =
    document.getElementById("productsGrid");

const emptyProducts =
    document.getElementById("emptyProducts");

const resultCount =
    document.getElementById("resultCount");

const searchInput =
    document.getElementById("searchInput");

const sortSelect =
    document.getElementById("sortSelect");

const newFilter =
    document.getElementById("newFilter");

const bestFilter =
    document.getElementById("bestFilter");

const stockFilter =
    document.getElementById("stockFilter");

const cartButton =
    document.getElementById("cartButton");

const cartPanel =
    document.getElementById("cartPanel");

const cartOverlay =
    document.getElementById("cartOverlay");

const closeCart =
    document.getElementById("closeCart");

const cartItems =
    document.getElementById("cartItems");

const cartTotal =
    document.getElementById("cartTotal");

const cartCount =
    document.getElementById("cartCount");

const favoritesButton =
    document.getElementById("favoritesButton");

const favoritesCount =
    document.getElementById("favoritesCount");

const toast =
    document.getElementById("toast");


/* ================= DATA ================= */

const productArray =
    Object.entries(products).map(
        ([id, product]) => ({
            id,
            ...product
        })
    );


/* ================= STORAGE ================= */

function readCart() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem("novaCart")
            );

        if (!Array.isArray(data)) {
            return [];
        }

        return data
            .map(item => ({
                id: String(item.id || ""),
                quantity: Math.max(
                    1,
                    Number(item.quantity) || 1
                )
            }))
            .filter(item => item.id);

    } catch {

        return [];
    }
}


function saveCart() {

    localStorage.setItem(
        "novaCart",
        JSON.stringify(cart)
    );
}


function readFavorites() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem("novaFavorites")
            );

        return Array.isArray(data)
            ? data.map(String)
            : [];

    } catch {

        return [];
    }
}


function saveFavorites() {

    localStorage.setItem(
        "novaFavorites",
        JSON.stringify(favorites)
    );
}


let cart = readCart();

let favorites = readFavorites();


/* ================= HELPERS ================= */

function getProduct(id) {

    return products[String(id)] || null;
}


function formatPrice(price) {

    return new Intl.NumberFormat("ru-RU")
        .format(Number(price) || 0) + " ₽";
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(
            () => toast.classList.remove("show"),
            1800
        );
}


/* ================= VISUALS ================= */

function getVisualClass(category) {

    const map = {

        smartphone: "device",
        laptop: "laptop",
        tablet: "tablet",
        audio: "buds",
        watch: "watch",
        accessory: "accessory"

    };

    return map[category] || "accessory";
}


/* ================= CARDS ================= */

function createProductCard(product) {

    const id =
        String(product.id);

    const favorite =
        favorites.includes(id);

    return `

<article class="product-card">

    <div class="product-image">

        ${
            product.badge
            ? `
                <div class="product-badge">
                    ${escapeHtml(product.badge)}
                </div>
              `
            : ""
        }

        <button
            class="favorite-btn ${favorite ? "active" : ""}"
            data-favorite="${escapeHtml(id)}"
            type="button"
        >
            ${favorite ? "♥" : "♡"}
        </button>

        <a
            class="product-visual-link"
            href="product.html?id=${encodeURIComponent(id)}"
        >

            <div
                class="${getVisualClass(product.category)}"
            ></div>

        </a>

    </div>

    <div class="product-info">

        <div class="product-brand">
            ${escapeHtml(product.brand || "NOVA")}
        </div>

        <h2 class="product-name">
            ${escapeHtml(product.name)}
        </h2>

        <p class="product-description">
            ${escapeHtml(
                product.description ||
                "Премиальное устройство NOVA."
            )}
        </p>

        <div class="product-bottom">

            <div class="product-price">
                ${formatPrice(product.price)}
            </div>

            <button
                class="add-cart"
                data-add-cart="${escapeHtml(id)}"
                type="button"
            >
                В корзину
            </button>

        </div>

        <a
            class="details-link"
            href="product.html?id=${encodeURIComponent(id)}"
        >
            Подробнее →
        </a>

    </div>

</article>

`;
}


/* ================= FILTER ================= */

function matchesPrice(product) {

    const filters =
        [
            ...document.querySelectorAll(
                ".price-filter:checked"
            )
        ];

    if (!filters.length) {
        return true;
    }

    const price =
        Number(product.price) || 0;

    return filters.some(filter => {

        const min =
            Number(filter.dataset.min);

        const max =
            filter.dataset.max === "Infinity"
            ? Infinity
            : Number(filter.dataset.max);

        return price >= min &&
               price <= max;
    });
}


function matchesSpecial(product) {

    const badge =
        String(product.badge || "")
            .toLowerCase();


    if (
        newFilter.checked &&
        !(
            badge.includes("new") ||
            badge.includes("нов")
        )
    ) {
        return false;
    }


    if (
        bestFilter.checked &&
        !(
            badge.includes("best") ||
            badge.includes("хит")
        )
    ) {
        return false;
    }


    if (
        stockFilter.checked &&
        product.stock === false
    ) {
        return false;
    }


    return true;
}


/* ================= PRODUCTS ================= */

function getFilteredProducts() {

    let result =
        [...productArray];


    if (selectedCategory !== "all") {

        result =
            result.filter(
                product =>
                    product.category ===
                    selectedCategory
            );
    }


    if (searchQuery.trim()) {

        const query =
            searchQuery
                .trim()
                .toLowerCase();

        result =
            result.filter(product => {

                const text = [

                    product.name,
                    product.brand,
                    product.description,
                    product.category,
                    product.badge

                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                return text.includes(query);
            });
    }


    result =
        result.filter(matchesPrice);

    result =
        result.filter(matchesSpecial);


    switch(sortSelect.value) {

        case "price-asc":

            result.sort(
                (a,b) =>
                    Number(a.price) -
                    Number(b.price)
            );

            break;

        case "price-desc":

            result.sort(
                (a,b) =>
                    Number(b.price) -
                    Number(a.price)
            );

            break;

        case "name-asc":

            result.sort(
                (a,b) =>
                    String(a.name)
                        .localeCompare(
                            String(b.name),
                            "ru"
                        )
            );

            break;

        case "name-desc":

            result.sort(
                (a,b) =>
                    String(b.name)
                        .localeCompare(
                            String(a.name),
                            "ru"
                        )
            );

            break;
    }


    return result;
}


function renderProducts() {

    const result =
        getFilteredProducts();


    resultCount.textContent =
        `Товаров: ${result.length}`;


    if (!result.length) {

        productsGrid.innerHTML = "";

        emptyProducts.style.display =
            "block";

        return;
    }


    emptyProducts.style.display =
        "none";


    productsGrid.innerHTML =
        result
            .map(createProductCard)
            .join("");
}


/* ================= CART ================= */

function addToCart(id) {

    id = String(id);


    const product =
        getProduct(id);


    if (!product) {

        showToast(
            "Товар не найден"
        );

        return;
    }


    const existing =
        cart.find(
            item => item.id === id
        );


    if (existing) {

        existing.quantity += 1;

    } else {

        cart.push({
            id: id,
            quantity: 1
        });
    }


    saveCart();

    updateCartUI();

    showToast(
        "Товар добавлен в корзину ✓"
    );
}


function changeQuantity(id, change) {

    id = String(id);


    const item =
        cart.find(
            item => item.id === id
        );


    if (!item) {
        return;
    }


    item.quantity += change;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                item => item.id !== id
            );
    }


    saveCart();

    updateCartUI();
}


function removeFromCart(id) {

    id = String(id);


    cart =
        cart.filter(
            item => item.id !== id
        );


    saveCart();

    updateCartUI();

    showToast(
        "Товар удалён"
    );
}


function getCartCount() {

    return cart.reduce(
        (total,item) =>
            total + item.quantity,
        0
    );
}


function getCartTotal() {

    return cart.reduce(
        (total,item) => {

            const product =
                getProduct(item.id);

            if (!product) {
                return total;
            }

            return total +
                Number(product.price || 0) *
                item.quantity;

        },
        0
    );
}


function renderCart() {

    if (!cart.length) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                Корзина пока пустая
            </div>
        `;

        cartTotal.textContent =
            "0 ₽";

        return;
    }


    cartItems.innerHTML =
        cart.map(item => {

            const product =
                getProduct(item.id);

            if (!product) {
                return "";
            }


            return `

<div class="cart-item">

    <div class="cart-item-info">

        <div class="cart-item-name">
            ${escapeHtml(product.name)}
        </div>

        <div class="cart-item-price">
            ${formatPrice(product.price)}
        </div>

    </div>

    <div class="cart-quantity">

        <button
            type="button"
            data-minus="${escapeHtml(product.id)}"
        >
            −
        </button>

        <span>
            ${item.quantity}
        </span>

        <button
            type="button"
            data-plus="${escapeHtml(product.id)}"
        >
            +
        </button>

    </div>

    <button
        class="remove-item"
        type="button"
        data-remove="${escapeHtml(product.id)}"
    >
        ×
    </button>

</div>

`;

        }).join("");


    cartTotal.textContent =
        formatPrice(getCartTotal());
}


function updateCartUI() {

    cartCount.textContent =
        getCartCount();

    renderCart();
}


/* ================= FAVORITES ================= */

function toggleFavorite(id) {

    id = String(id);


    if (favorites.includes(id)) {

        favorites =
            favorites.filter(
                item => item !== id
            );

        showToast(
            "Удалено из избранного"
        );

    } else {

        favorites.push(id);

        showToast(
            "Добавлено в избранное ✓"
        );
    }


    saveFavorites();

    favoritesCount.textContent =
        favorites.length;

    renderProducts();
}


/* ================= PANEL ================= */

function openCart() {

    cartPanel.classList.add("open");

    cartOverlay.classList.add("open");

    document.body.style.overflow =
        "hidden";
}


function closeCartPanel() {

    cartPanel.classList.remove("open");

    cartOverlay.classList.remove("open");

    document.body.style.overflow =
        "";
}


cartButton.addEventListener(
    "click",
    openCart
);

closeCart.addEventListener(
    "click",
    closeCartPanel
);

cartOverlay.addEventListener(
    "click",
    closeCartPanel
);


/* ================= PRODUCT CLICKS ================= */

productsGrid.addEventListener(
    "click",
    event => {

        const addButton =
            event.target.closest(
                "[data-add-cart]"
            );


        if (addButton) {

            event.preventDefault();

            addToCart(
                addButton.dataset.addCart
            );

            return;
        }


        const favoriteButton =
            event.target.closest(
                "[data-favorite]"
            );


        if (favoriteButton) {

            event.preventDefault();

            event.stopPropagation();

            toggleFavorite(
                favoriteButton.dataset.favorite
            );
        }

    }
);


/* ================= CART CLICKS ================= */

cartItems.addEventListener(
    "click",
    event => {

        const plus =
            event.target.closest(
                "[data-plus]"
            );

        const minus =
            event.target.closest(
                "[data-minus]"
            );

        const remove =
            event.target.closest(
                "[data-remove]"
            );


        if (plus) {

            changeQuantity(
                plus.dataset.plus,
                1
            );

            return;
        }


        if (minus) {

            changeQuantity(
                minus.dataset.minus,
                -1
            );

            return;
        }


        if (remove) {

            removeFromCart(
                remove.dataset.remove
            );
        }

    }
);


/* ================= CATEGORY ================= */

let selectedCategory = "all";

let searchQuery = "";


document
    .querySelectorAll(".category-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".category-btn"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                selectedCategory =
                    button.dataset.category;

                renderProducts();
            }
        );

    });


/* ================= SEARCH ================= */

searchInput.addEventListener(
    "input",
    () => {

        searchQuery =
            searchInput.value;

        renderProducts();
    }
);


/* ================= SORT ================= */

sortSelect.addEventListener(
    "change",
    renderProducts
);


/* ================= FILTERS ================= */

document
    .querySelectorAll(".price-filter")
    .forEach(filter => {

        filter.addEventListener(
            "change",
            renderProducts
        );

    });


newFilter.addEventListener(
    "change",
    renderProducts
);

bestFilter.addEventListener(
    "change",
    renderProducts
);

stockFilter.addEventListener(
    "change",
    renderProducts
);


/* ================= FAVORITES BUTTON ================= */

favoritesButton.addEventListener(
    "click",
    () => {

        if (!favorites.length) {

            showToast(
                "Избранное пока пустое"
            );

            return;
        }

        showToast(
            `В избранном: ${favorites.length}`
        );
    }
);


/* ================= INIT ================= */

updateCartUI();

favoritesCount.textContent =
    favorites.length;

renderProducts();

</script>

</body>
</html>
