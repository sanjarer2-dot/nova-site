<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог — NOVA</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   NOVA CATALOG
   Все размеры каталога изолированы здесь.
   products.js НЕ изменяется.
===================================================== */

.catalog-page {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    font-family: Inter, Arial, sans-serif;
}

/* ================= HEADER ================= */

.catalog-header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 62px;
    padding: 0 4%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(5,5,5,.9);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255,255,255,.07);
}

.catalog-header .logo {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3px;
}

.header-nav {
    display: flex;
    align-items: center;
    gap: 24px;
}

.header-nav a {
    color: #777;
    font-size: 11px;
    transition: .2s;
}

.header-nav a:hover,
.header-nav a.active {
    color: #fff;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}

.header-action {
    position: relative;

    width: 34px;
    height: 34px;

    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 9px;

    background: rgba(255,255,255,.035);
    color: #fff;

    cursor: pointer;
}

.header-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    font-size: 13px;
    line-height: 1;
}

.counter {
    position: absolute;

    top: -5px;
    right: -5px;

    min-width: 15px;
    height: 15px;

    padding: 0 3px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff;
    color: #000;

    font-size: 8px;
    font-weight: 800;
}

/* ================= HERO ================= */

.catalog-hero {
    padding: 55px 20px 38px;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,255,255,.07),
            transparent 40%
        );
}

.hero-label {
    display: inline-block;

    margin-bottom: 11px;
    padding: 5px 10px;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 20px;

    color: #666;

    font-size: 8px;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}

.catalog-hero h1 {
    margin: 0;

    font-size: clamp(34px,5vw,48px);
    line-height: 1;
    letter-spacing: -2.5px;
}

.catalog-hero p {
    max-width: 480px;

    margin: 12px auto 0;

    color: #666;

    font-size: 11px;
    line-height: 1.55;
}

/* ================= CATEGORIES ================= */

.category-section {
    padding: 0 4% 25px;
}

.category-list {
    display: flex;
    gap: 7px;

    overflow-x: auto;

    padding: 2px 0 5px;

    scrollbar-width: none;
}

.category-list::-webkit-scrollbar {
    display: none;
}

.category-btn {
    flex: 0 0 auto;

    padding: 7px 12px;

    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;

    background: rgba(255,255,255,.025);

    color: #666;

    font-size: 9px;

    cursor: pointer;

    transition: .2s;
}

.category-btn:hover {
    color: #fff;
}

.category-btn.active {
    background: #fff;
    color: #000;
    border-color: #fff;
}

/* ================= LAYOUT ================= */

.catalog-layout {
    max-width: 1450px;

    margin: auto;
    padding: 0 4% 65px;

    display: grid;

    grid-template-columns: 175px minmax(0,1fr);

    gap: 20px;
}

/* ================= FILTERS ================= */

.filters {
    position: sticky;
    top: 78px;
    align-self: start;

    padding: 14px;

    border: 1px solid rgba(255,255,255,.07);
    border-radius: 14px;

    background: rgba(255,255,255,.02);
}

.filters h3 {
    margin: 0 0 13px;

    font-size: 12px;
}

.filter-group {
    padding: 11px 0;

    border-top: 1px solid rgba(255,255,255,.06);
}

.filter-group:first-of-type {
    padding-top: 0;
    border-top: 0;
}

.filter-title {
    margin-bottom: 8px;

    color: #555;

    font-size: 8px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.filter-option {
    display: flex;
    align-items: center;
    gap: 6px;

    margin: 6px 0;

    color: #777;

    font-size: 9px;

    cursor: pointer;
}

.filter-option input {
    width: 11px;
    height: 11px;

    margin: 0;

    accent-color: #fff;
}

/* ================= TOOLBAR ================= */

.catalog-toolbar {
    display: flex;
    gap: 7px;

    margin-bottom: 9px;
}

.search-box {
    flex: 1;
}

.search-box input {
    width: 100%;
    height: 35px;

    padding: 0 11px;

    outline: none;

    border: 1px solid rgba(255,255,255,.07);
    border-radius: 9px;

    background: rgba(255,255,255,.025);
    color: #fff;

    font-size: 9px;
}

.search-box input::placeholder {
    color: #444;
}

.sort-select {
    width: 145px;
    height: 35px;

    padding: 0 9px;

    outline: none;

    border: 1px solid rgba(255,255,255,.07);
    border-radius: 9px;

    background: #101010;
    color: #fff;

    font-size: 9px;
}

.result-count {
    margin-bottom: 9px;

    color: #444;

    font-size: 8px;
}

/* ================= PRODUCTS GRID ================= */

.products-grid {
    display: grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap: 10px;
}

/* ================= CARD ================= */

.product-card {
    min-width: 0;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.065);
    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.012)
        );

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.product-card:hover {
    transform: translateY(-3px);

    border-color: rgba(255,255,255,.14);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3);
}

/* ================= PRODUCT IMAGE ================= */

.product-image {
    position: relative;

    height: 170px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.055),
            transparent 62%
        );
}

.product-visual-link {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;
}

/* ================= BADGE ================= */

.product-badge {
    position: absolute;

    top: 7px;
    left: 7px;

    z-index: 5;

    padding: 4px 6px;

    border-radius: 5px;

    background: rgba(255,255,255,.07);

    color: #777;

    font-size: 6px;
    font-weight: 700;
    letter-spacing: .8px;
}

/* ================= FAVORITE ================= */

.favorite-btn {
    position: absolute;

    top: 7px;
    right: 7px;

    z-index: 20;

    width: 26px;
    height: 26px;

    padding: 0;
    margin: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 50%;

    background: rgba(0,0,0,.42);

    color: #666;

    font-family: Arial,sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1;

    cursor: pointer;

    appearance: none;
    -webkit-appearance: none;

    transition: .2s;
}

.favorite-btn:hover {
    color: #fff;
    background: rgba(255,255,255,.1);
}

.favorite-btn.active {
    color: #fff;
}

/* ================= PHONE ================= */

.device {
    position: relative;

    width: 65px;
    height: 130px;

    border: 3px solid #252525;
    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            #202020,
            #080808
        );

    box-shadow:
        0 18px 32px rgba(0,0,0,.55);

    transform: rotate(-3deg);

    transition: .3s;
}

.device::before {
    content: "";

    position: absolute;

    top: 5px;
    left: 50%;

    width: 27px;
    height: 7px;

    border-radius: 8px;

    background: #000;

    transform: translateX(-50%);
}

.device::after {
    content: "NOVA";

    position: absolute;

    bottom: 10px;
    left: 50%;

    transform: translateX(-50%);

    color: #444;

    font-size: 5px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.product-card:hover .device {
    transform: rotate(0) scale(1.04);
}

/* ================= LAPTOP ================= */

.laptop {
    position: relative;

    width: 135px;
    height: 82px;

    border: 4px solid #252525;
    border-bottom-width: 6px;

    border-radius: 9px 9px 3px 3px;

    background:
        linear-gradient(
            145deg,
            #222,
            #080808
        );

    box-shadow:
        0 18px 32px rgba(0,0,0,.55);

    transition: .3s;
}

.laptop::after {
    content: "";

    position: absolute;

    left: -13px;
    bottom: -12px;

    width: 157px;
    height: 6px;

    border-radius: 0 0 9px 9px;

    background: #292929;
}

.product-card:hover .laptop {
    transform: scale(1.04);
}

/* ================= TABLET ================= */

.tablet {
    position: relative;

    width: 95px;
    height: 126px;

    border: 4px solid #252525;
    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #202020,
            #080808
        );

    box-shadow:
        0 18px 32px rgba(0,0,0,.55);

    transform: rotate(-2deg);

    transition: .3s;
}

.tablet::before {
    content: "";

    position: absolute;

    top: 5px;
    left: 50%;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #444;

    transform: translateX(-50%);
}

.product-card:hover .tablet {
    transform: rotate(0) scale(1.04);
}

/* ================= AUDIO ================= */

.buds {
    position: relative;

    width: 92px;
    height: 63px;

    transition: .3s;
}

.buds::before,
.buds::after {
    content: "";

    position: absolute;

    top: 7px;

    width: 35px;
    height: 46px;

    border-radius: 20px 20px 16px 16px;

    background:
        linear-gradient(
            145deg,
            #292929,
            #080808
        );

    box-shadow:
        0 15px 25px rgba(0,0,0,.55);
}

.buds::before {
    left: 8px;
    transform: rotate(-11deg);
}

.buds::after {
    right: 8px;
    transform: rotate(11deg);
}

.product-card:hover .buds {
    transform: scale(1.05);
}

/* ================= WATCH ================= */

.watch {
    position: relative;

    width: 75px;
    height: 97px;

    transition: .3s;
}

.watch::before {
    content: "";

    position: absolute;

    left: 19px;
    top: 0;

    width: 37px;
    height: 97px;

    border-radius: 20px;

    background: #171717;

    box-shadow:
        0 18px 32px rgba(0,0,0,.55);
}

.watch::after {
    content: "";

    position: absolute;

    left: 23px;
    top: 21px;

    width: 29px;
    height: 40px;

    border-radius: 8px;

    background: #050505;

    border: 2px solid #2b2b2b;
}

.product-card:hover .watch {
    transform: scale(1.05);
}

/* ================= ACCESSORY ================= */

.accessory {
    position: relative;

    width: 100px;
    height: 61px;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #252525,
            #080808
        );

    box-shadow:
        0 18px 32px rgba(0,0,0,.55);

    transition: .3s;
}

.accessory::after {
    content: "NOVA";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    color: #444;

    font-size: 7px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.product-card:hover .accessory {
    transform: scale(1.05);
}

/* ================= INFO ================= */

.product-info {
    padding: 10px;
}

.product-brand {
    margin-bottom: 3px;

    color: #4d4d4d;

    font-size: 6px;
    letter-spacing: 1px;

    text-transform: uppercase;
}

.product-name {
    min-height: 30px;

    margin: 0;

    color: #fff;

    font-size: 12px;
    font-weight: 600;

    line-height: 1.25;
}

.product-description {
    min-height: 27px;

    margin: 5px 0 8px;

    color: #555;

    font-size: 8px;
    line-height: 1.4;
}

.product-bottom {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 5px;
}

.product-price {
    color: #fff;

    font-size: 12px;
    font-weight: 700;

    white-space: nowrap;
}

.add-cart {
    padding: 6px 8px;

    border: 0;
    border-radius: 7px;

    background: #fff;
    color: #000;

    font-size: 8px;
    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;
}

.details-link {
    display: inline-block;

    margin-top: 6px;

    color: #4d4d4d;

    font-size: 7px;
}

.details-link:hover {
    color: #fff;
}

/* ================= EMPTY ================= */

.empty-products {
    display: none;

    padding: 55px 15px;

    text-align: center;

    border: 1px solid rgba(255,255,255,.07);
    border-radius: 15px;

    color: #555;
}

.empty-products h3 {
    margin-bottom: 6px;

    color: #fff;

    font-size: 14px;
}

.empty-products p {
    font-size: 9px;
}

/* ================= CART ================= */

.cart-overlay {
    position: fixed;
    inset: 0;

    z-index: 2000;

    display: none;

    background: rgba(0,0,0,.55);

    backdrop-filter: blur(4px);
}

.cart-overlay.open {
    display: block;
}

.cart-panel {
    position: fixed;

    top: 0;
    right: 0;

    z-index: 2001;

    width: min(360px,100%);
    height: 100vh;

    padding: 20px;

    display: flex;
    flex-direction: column;

    background: #0b0b0b;

    border-left: 1px solid rgba(255,255,255,.08);

    transform: translateX(100%);

    transition: .3s ease;
}

.cart-panel.open {
    transform: translateX(0);
}

.cart-head {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 17px;
}

.cart-head h2 {
    font-size: 18px;
}

.close-cart {
    width: 30px;
    height: 30px;

    padding: 0;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 50%;

    background: rgba(255,255,255,.04);

    color: #fff;

    font-size: 16px;
    line-height: 1;

    cursor: pointer;
}

.cart-items {
    flex: 1;
    overflow-y: auto;
}

.cart-item {
    display: flex;
    align-items: center;

    gap: 8px;

    padding: 12px 0;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.cart-item-info {
    flex: 1;
    min-width: 0;
}

.cart-item-name {
    margin-bottom: 3px;

    font-size: 10px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cart-item-price {
    color: #666;
    font-size: 9px;
}

.cart-quantity {
    display: flex;
    align-items: center;
    gap: 5px;
}

.cart-quantity button {
    width: 23px;
    height: 23px;

    padding: 0;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 6px;

    background: rgba(255,255,255,.04);
    color: #fff;

    cursor: pointer;
}

.cart-quantity span {
    min-width: 12px;

    text-align: center;

    font-size: 9px;
}

.remove-item {
    width: 22px;
    height: 22px;

    padding: 0;

    border: 0;

    background: transparent;

    color: #555;

    font-size: 15px;

    cursor: pointer;
}

.empty-cart {
    padding: 45px 0;

    text-align: center;

    color: #555;

    font-size: 10px;
}

.cart-footer {
    padding-top: 15px;

    border-top: 1px solid rgba(255,255,255,.07);
}

.cart-total {
    display: flex;
    justify-content: space-between;

    margin-bottom: 12px;

    font-size: 14px;
    font-weight: 700;
}

.open-cart-btn {
    width: 100%;

    padding: 11px;

    border: 0;
    border-radius: 9px;

    background: #fff;
    color: #000;

    font-size: 9px;
    font-weight: 700;

    cursor: pointer;
}

/* ================= TOAST ================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 18px;

    z-index: 3000;

    padding: 9px 13px;

    border: 1px solid rgba(255,255,255,.1);
    border-radius: 9px;

    background: #151515;

    color: #fff;

    font-size: 9px;

    transform: translate(-50%,70px);

    opacity: 0;

    pointer-events: none;

    transition: .3s;
}

.toast.show {
    transform: translate(-50%,0);
    opacity: 1;
}

/* ================= FOOTER ================= */

.catalog-page footer {
    padding: 35px 5%;

    border-top: 1px solid rgba(255,255,255,.06);

    color: #444;

    text-align: center;

    font-size: 8px;
}

/* ================= RESPONSIVE ================= */

@media (max-width:1150px) {

    .products-grid {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }
}

@media (max-width:850px) {

    .header-nav {
        display: none;
    }

    .catalog-layout {
        grid-template-columns: 1fr;
    }

    .filters {
        position: static;
    }

    .products-grid {
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }
}

@media (max-width:650px) {

    .catalog-header {
        padding: 0 16px;
    }

    .catalog-hero {
        padding: 45px 16px 30px;
    }

    .category-section,
    .catalog-layout {
        padding-left: 16px;
        padding-right: 16px;
    }

    .catalog-toolbar {
        flex-direction: column;
    }

    .sort-select {
        width: 100%;
    }

    .products-grid {
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap: 8px;
    }

    .product-image {
        height: 155px;
    }

    .product-name {
        font-size: 11px;
    }

    .product-description {
        font-size: 7px;
    }

    .product-price {
        font-size: 11px;
    }

    .add-cart {
        padding: 6px 7px;
        font-size: 7px;
    }
}

</style>
</head>

<body>

<div class="catalog-page">

<header class="catalog-header">

    <a href="index.html" class="logo">
        NOVA
    </a>

    <nav class="header-nav">

        <a href="index.html">
            Главная
        </a>

        <a href="catalog.html" class="active">
            Каталог
        </a>

        <a href="about.html">
            О нас
        </a>

        <a href="contacts.html">
            Контакты
        </a>

    </nav>

    <div class="header-actions">

        <button
            class="header-action"
            id="favoritesButton"
            aria-label="Избранное"
        >
            <span class="header-icon">♡</span>
            <span class="counter" id="favoritesCount">0</span>
        </button>

        <button
            class="header-action"
            id="cartButton"
            aria-label="Корзина"
        >
            <span class="header-icon">🛒</span>
            <span class="counter" id="cartCount">0</span>
        </button>

    </div>

</header>


<section class="catalog-hero">

    <div class="hero-label">
        NOVA Store
    </div>

    <h1>
        Каталог
    </h1>

    <p>
        Техника нового поколения.
        Выбирай устройство, которое подходит именно тебе.
    </p>

</section>


<section class="category-section">

    <div class="category-list">

        <button class="category-btn active" data-category="all">
            Все товары
        </button>

        <button class="category-btn" data-category="smartphone">
            Смартфоны
        </button>

        <button class="category-btn" data-category="laptop">
            Ноутбуки
        </button>

        <button class="category-btn" data-category="tablet">
            Планшеты
        </button>

        <button class="category-btn" data-category="audio">
            Аудио
        </button>

        <button class="category-btn" data-category="watch">
            Часы
        </button>

        <button class="category-btn" data-category="accessory">
            Аксессуары
        </button>

    </div>

</section>


<main class="catalog-layout">

<aside class="filters">

    <h3>
        Фильтры
    </h3>

    <div class="filter-group">

        <div class="filter-title">
            Цена
        </div>

        <label class="filter-option">
            <input
                type="checkbox"
                class="price-filter"
                data-min="0"
                data-max="49999"
            >
            До 50 000 ₽
        </label>

        <label class="filter-option">
            <input
                type="checkbox"
                class="price-filter"
                data-min="50000"
                data-max="100000"
            >
            50 000 — 100 000 ₽
        </label>

        <label class="filter-option">
            <input
                type="checkbox"
                class="price-filter"
                data-min="100001"
                data-max="Infinity"
            >
            От 100 001 ₽
        </label>

    </div>

    <div class="filter-group">

        <div class="filter-title">
            Особое
        </div>

        <label class="filter-option">
            <input type="checkbox" id="newFilter">
            Новинки
        </label>

        <label class="filter-option">
            <input type="checkbox" id="bestFilter">
            Бестселлеры
        </label>

    </div>

    <div class="filter-group">

        <label class="filter-option">
            <input
                type="checkbox"
                id="stockFilter"
                checked
            >
            В наличии
        </label>

    </div>

</aside>


<section class="catalog-main">

    <div class="catalog-toolbar">

        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Поиск по каталогу..."
                autocomplete="off"
            >

        </div>

        <select
            id="sortSelect"
            class="sort-select"
        >

            <option value="default">
                По умолчанию
            </option>

            <option value="price-asc">
                Цена: по возрастанию
            </option>

            <option value="price-desc">
                Цена: по убыванию
            </option>

            <option value="name-asc">
                Название: А–Я
            </option>

            <option value="name-desc">
                Название: Я–А
            </option>

        </select>

    </div>

    <div
        class="result-count"
        id="resultCount"
    >
        Товаров: 0
    </div>

    <div
        class="products-grid"
        id="productsGrid"
    ></div>

    <div
        class="empty-products"
        id="emptyProducts"
    >

        <h3>
            Ничего не найдено
        </h3>

        <p>
            Попробуй изменить запрос или фильтры.
        </p>

    </div>

</section>

</main>


<!-- ================= CART ================= -->

<div
    class="cart-overlay"
    id="cartOverlay"
></div>

<aside
    class="cart-panel"
    id="cartPanel"
>

    <div class="cart-head">

        <h2>
            Корзина
        </h2>

        <button
            class="close-cart"
            id="closeCart"
            aria-label="Закрыть"
        >
            ×
        </button>

    </div>

    <div
        class="cart-items"
        id="cartItems"
    ></div>

    <div class="cart-footer">

        <div class="cart-total">

            <span>
                Итого
            </span>

            <span id="cartTotal">
                0 ₽
            </span>

        </div>

        <a href="cart.html">
            <button class="open-cart-btn">
                Перейти в корзину
            </button>
        </a>

    </div>

</aside>


<div
    class="toast"
    id="toast"
></div>


<footer>
    © 2026 NOVA. Техника. Без компромиссов.
</footer>

</div>


<script src="products.js"></script>

<script>

/* =====================================================
   NOVA CATALOG JS
===================================================== */

const productsGrid =
    document.getElementById("productsGrid");

const emptyProducts =
    document.getElementById("emptyProducts");

const resultCount =
    document.getElementById("resultCount");

const searchInput =
    document.getElementById("searchInput");

const sortSelect =
    document.getElementById("sortSelect");

const newFilter =
    document.getElementById("newFilter");

const bestFilter =
    document.getElementById("bestFilter");

const stockFilter =
    document.getElementById("stockFilter");

const cartButton =
    document.getElementById("cartButton");

const cartPanel =
    document.getElementById("cartPanel");

const cartOverlay =
    document.getElementById("cartOverlay");

const closeCart =
    document.getElementById("closeCart");

const cartItems =
    document.getElementById("cartItems");

const cartTotal =
    document.getElementById("cartTotal");

const cartCount =
    document.getElementById("cartCount");

const favoritesButton =
    document.getElementById("favoritesButton");

const favoritesCount =
    document.getElementById("favoritesCount");

const toast =
    document.getElementById("toast");


/* ================= DATA ================= */

const productArray =
    Object.entries(products).map(
        ([id, product]) => ({
            id,
            ...product
        })
    );


/* ================= STATE ================= */

let selectedCategory = "all";

let searchQuery = "";

let cart = readCart();

let favorites = readFavorites();


/* ================= HELPERS ================= */

function formatPrice(price) {

    return new Intl.NumberFormat("ru-RU")
        .format(Number(price) || 0) + " ₽";
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function readCart() {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem("novaCart")
            );

        if (!Array.isArray(saved)) {
            return [];
        }

        return saved
            .map(item => ({
                id: String(item.id || ""),
                quantity: Math.max(
                    1,
                    Number(item.quantity) || 1
                )
            }))
            .filter(item => item.id);

    } catch {

        return [];
    }
}


function saveCart() {

    localStorage.setItem(
        "novaCart",
        JSON.stringify(cart)
    );
}


function readFavorites() {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem("novaFavorites")
            );

        return Array.isArray(saved)
            ? saved.map(String)
            : [];

    } catch {

        return [];
    }
}


function saveFavorites() {

    localStorage.setItem(
        "novaFavorites",
        JSON.stringify(favorites)
    );
}


function getProduct(id) {

    return products[id] || null;
}


function getCartQuantity() {

    return cart.reduce(
        (sum,item) =>
            sum + item.quantity,
        0
    );
}


function getCartTotal() {

    return cart.reduce(
        (sum,item) => {

            const product =
                getProduct(item.id);

            if (!product) {
                return sum;
            }

            return sum +
                Number(product.price || 0) *
                item.quantity;

        },
        0
    );
}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(() => {
            toast.classList.remove("show");
        },1800);
}


/* ================= VISUAL ================= */

function getVisualClass(category) {

    const visualClasses = {

        smartphone: "device",
        laptop: "laptop",
        tablet: "tablet",
        audio: "buds",
        watch: "watch",
        accessory: "accessory"

    };

    return visualClasses[category] || "accessory";
}


/* ================= CARD ================= */

function createProductCard(product) {

    const id = String(product.id);

    const isFavorite =
        favorites.includes(id);

    return `

<article class="product-card">

    <div class="product-image">

        ${
            product.badge
            ? `
                <div class="product-badge">
                    ${escapeHtml(product.badge)}
                </div>
              `
            : ""
        }

        <button
            class="favorite-btn ${isFavorite ? "active" : ""}"
            data-favorite="${escapeHtml(id)}"
            aria-label="Избранное"
            type="button"
        >
            ${isFavorite ? "♥" : "♡"}
        </button>

        <a
            class="product-visual-link"
            href="product.html?id=${encodeURIComponent(id)}"
        >

            <div
                class="${getVisualClass(product.category)}"
            ></div>

        </a>

    </div>


    <div class="product-info">

        <div class="product-brand">
            ${escapeHtml(product.brand || "NOVA")}
        </div>

        <h2 class="product-name">
            ${escapeHtml(product.name)}
        </h2>

        <p class="product-description">
            ${escapeHtml(
                product.description ||
                "Премиальное устройство NOVA."
            )}
        </p>

        <div class="product-bottom">

            <div class="product-price">
                ${formatPrice(product.price)}
            </div>

            <button
                class="add-cart"
                data-add-cart="${escapeHtml(id)}"
                type="button"
            >
                В корзину
            </button>

        </div>

        <a
            class="details-link"
            href="product.html?id=${encodeURIComponent(id)}"
        >
            Подробнее →
        </a>

    </div>

</article>

`;
}


/* ================= FILTERS ================= */

function matchesPrice(product) {

    const checked = [
        ...document.querySelectorAll(
            ".price-filter:checked"
        )
    ];

    if (!checked.length) {
        return true;
    }

    const price =
        Number(product.price) || 0;

    return checked.some(filter => {

        const min =
            Number(filter.dataset.min);

        const max =
            filter.dataset.max === "Infinity"
            ? Infinity
            : Number(filter.dataset.max);

        return price >= min && price <= max;
    });
}


function matchesSpecialFilters(product) {

    const badge =
        String(product.badge || "")
            .toUpperCase();

    if (
        newFilter.checked &&
        !(
            badge.includes("NEW") ||
            badge.includes("НОВ")
        )
    ) {
        return false;
    }

    if (
        bestFilter.checked &&
        !(
            badge.includes("BEST") ||
            badge.includes("ХИТ")
        )
    ) {
        return false;
    }

    if (
        stockFilter.checked &&
        product.stock === false
    ) {
        return false;
    }

    return true;
}


function getFilteredProducts() {

    let result =
        [...productArray];


    if (selectedCategory !== "all") {

        result =
            result.filter(
                product =>
                    product.category ===
                    selectedCategory
            );
    }


    if (searchQuery.trim()) {

        const query =
            searchQuery
                .trim()
                .toLowerCase();

        result =
            result.filter(product => {

                const text = [

                    product.name,
                    product.brand,
                    product.description,
                    product.category,
                    product.badge

                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                return text.includes(query);
            });
    }


    result =
        result.filter(matchesPrice);

    result =
        result.filter(matchesSpecialFilters);


    switch(sortSelect.value) {

        case "price-asc":

            result.sort(
                (a,b) =>
                    Number(a.price) -
                    Number(b.price)
            );

            break;


        case "price-desc":

            result.sort(
                (a,b) =>
                    Number(b.price) -
                    Number(a.price)
            );

            break;


        case "name-asc":

            result.sort(
                (a,b) =>
                    String(a.name)
                        .localeCompare(
                            String(b.name),
                            "ru"
                        )
            );

            break;


        case "name-desc":

            result.sort(
                (a,b) =>
                    String(b.name)
                        .localeCompare(
                            String(a.name),
                            "ru"
                        )
            );

            break;
    }

    return result;
}


/* ================= RENDER ================= */

function renderProducts() {

    const result =
        getFilteredProducts();

    resultCount.textContent =
        `Товаров: ${result.length}`;


    if (!result.length) {

        productsGrid.innerHTML = "";

        emptyProducts.style.display =
            "block";

        return;
    }


    emptyProducts.style.display =
        "none";


    productsGrid.innerHTML =
        result
            .map(createProductCard)
            .join("");
}


/* ================= CART ================= */

function addToCart(id) {

    id = String(id);

    const product =
        getProduct(id);

    if (!product) {

        showToast(
            "Ошибка: товар не найден"
        );

        return;
    }


    const existing =
        cart.find(
            item => item.id === id
        );


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({
            id,
            quantity: 1
        });
    }


    saveCart();

    updateCartUI();

    showToast(
        "Товар добавлен в корзину ✓"
    );
}


function changeCartQuantity(id,change) {

    id = String(id);

    const item =
        cart.find(
            item => item.id === id
        );

    if (!item) {
        return;
    }


    item.quantity += change;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                item => item.id !== id
            );
    }


    saveCart();

    updateCartUI();
}


function removeFromCart(id) {

    id = String(id);

    cart =
        cart.filter(
            item => item.id !== id
        );

    saveCart();

    updateCartUI();

    showToast(
        "Товар удалён"
    );
}


function renderCart() {

    if (!cart.length) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                Корзина пока пустая
            </div>
        `;

        cartTotal.textContent =
            "0 ₽";

        return;
    }


    cartItems.innerHTML =
        cart.map(item => {

            const product =
                getProduct(item.id);

            if (!product) {
                return "";
            }


            return `

<div class="cart-item">

    <div class="cart-item-info">

        <div class="cart-item-name">
            ${escapeHtml(product.name)}
        </div>

        <div class="cart-item-price">
            ${formatPrice(product.price)}
        </div>

    </div>

    <div class="cart-quantity">

        <button
            type="button"
            data-cart-minus="${escapeHtml(product.id)}"
        >
            −
        </button>

        <span>
            ${item.quantity}
        </span>

        <button
            type="button"
            data-cart-plus="${escapeHtml(product.id)}"
        >
            +
        </button>

    </div>

    <button
        class="remove-item"
        type="button"
        data-cart-remove="${escapeHtml(product.id)}"
        aria-label="Удалить"
    >
        ×
    </button>

</div>

`;

        }).join("");


    cartTotal.textContent =
        formatPrice(getCartTotal());
}


function updateCartUI() {

    cartCount.textContent =
        getCartQuantity();

    renderCart();
}


/* ================= FAVORITES ================= */

function toggleFavorite(id) {

    id = String(id);


    if (favorites.includes(id)) {

        favorites =
            favorites.filter(
                favoriteId =>
                    favoriteId !== id
            );

        showToast(
            "Удалено из избранного"
        );

    } else {

        favorites.push(id);

        showToast(
            "Добавлено в избранное ✓"
        );
    }


    saveFavorites();

    updateFavoritesUI();

    renderProducts();
}


function updateFavoritesUI() {

    favoritesCount.textContent =
        favorites.length;
}


/* ================= CART PANEL ================= */

function openCart() {

    cartPanel.classList.add("open");

    cartOverlay.classList.add("open");

    document.body.style.overflow =
        "hidden";
}


function closeCartPanel() {

    cartPanel.classList.remove("open");

    cartOverlay.classList.remove("open");

    document.body.style.overflow =
        "";
}


cartButton.addEventListener(
    "click",
    openCart
);

closeCart.addEventListener(
    "click",
    closeCartPanel
);

cartOverlay.addEventListener(
    "click",
    closeCartPanel
);


/* ================= PRODUCT EVENTS ================= */

productsGrid.addEventListener(
    "click",
    event => {

        const addButton =
            event.target.closest(
                "[data-add-cart]"
            );


        if (addButton) {

            event.preventDefault();

            addToCart(
                addButton.dataset.addCart
            );

            return;
        }


        const favoriteButton =
            event.target.closest(
                "[data-favorite]"
            );


        if (favoriteButton) {

            event.preventDefault();

            event.stopPropagation();

            toggleFavorite(
                favoriteButton.dataset.favorite
            );
        }

    }
);


/* ================= CART EVENTS ================= */

cartItems.addEventListener(
    "click",
    event => {

        const plus =
            event.target.closest(
                "[data-cart-plus]"
            );

        const minus =
            event.target.closest(
                "[data-cart-minus]"
            );

        const remove =
            event.target.closest(
                "[data-cart-remove]"
            );


        if (plus) {

            changeCartQuantity(
                plus.dataset.cartPlus,
                1
            );

            return;
        }


        if (minus) {

            changeCartQuantity(
                minus.dataset.cartMinus,
                -1
            );

            return;
        }


        if (remove) {

            removeFromCart(
                remove.dataset.cartRemove
            );
        }

    }
);


/* ================= CATEGORY ================= */

document
    .querySelectorAll(".category-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".category-btn"
                    )
                    .forEach(btn =>
                        btn.classList.remove(
                            "active"
                        )
                    );

                button.classList.add("active");

                selectedCategory =
                    button.dataset.category;

                renderProducts();
            }
        );

    });


/* ================= SEARCH ================= */

searchInput.addEventListener(
    "input",
    () => {

        searchQuery =
            searchInput.value;

        renderProducts();
    }
);


/* ================= SORT ================= */

sortSelect.addEventListener(
    "change",
    renderProducts
);


/* ================= FILTERS ================= */

document
    .querySelectorAll(".price-filter")
    .forEach(filter => {

        filter.addEventListener(
            "change",
            renderProducts
        );

    });


newFilter.addEventListener(
    "change",
    renderProducts
);

bestFilter.addEventListener(
    "change",
    renderProducts
);

stockFilter.addEventListener(
    "change",
    renderProducts
);


/* ================= FAVORITES ================= */

favoritesButton.addEventListener(
    "click",
    () => {

        if (!favorites.length) {

            showToast(
                "Избранное пока пустое"
            );

            return;
        }

        showToast(
            `В избранном: ${favorites.length}`
        );
    }
);


/* ================= START ================= */

updateCartUI();

updateFavoritesUI();

renderProducts();

</script>

</body>
</html>
