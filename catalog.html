<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Каталог — NOVA</title>
    <meta name="description" content="Каталог NOVA — смартфоны, ноутбуки, планшеты, аудио, часы и аксессуары.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* HEADER */

        .catalog-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: rgba(5, 5, 5, 0.82);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .header-nav {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .header-nav a {
            color: #aaa;
            font-size: 14px;
            transition: 0.2s;
        }

        .header-nav a:hover,
        .header-nav a.active {
            color: #fff;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-action {
            position: relative;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 13px;
            background: rgba(255,255,255,.04);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
        }

        .header-action:hover {
            background: rgba(255,255,255,.1);
            transform: translateY(-1px);
        }

        .counter {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 20px;
            background: #fff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* HERO */

        .catalog-hero {
            position: relative;
            overflow: hidden;
            padding: 110px 5% 75px;
            text-align: center;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,255,255,.09), transparent 35%),
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: auto, 40px 40px, 40px 40px;
        }

        .catalog-hero::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(255,255,255,.04);
            filter: blur(80px);
            left: 50%;
            top: -250px;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .hero-label {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin-bottom: 18px;
            padding: 7px 13px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 30px;
            color: #aaa;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .catalog-hero h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(42px, 7vw, 82px);
            letter-spacing: -4px;
        }

        .catalog-hero p {
            position: relative;
            z-index: 1;
            max-width: 600px;
            margin: 20px auto 0;
            color: #8c8c8c;
            line-height: 1.7;
            font-size: 15px;
        }

        /* CATEGORY */

        .category-section {
            padding: 0 5% 45px;
        }

        .category-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 0 10px;
            scrollbar-width: none;
        }

        .category-list::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            flex: 0 0 auto;
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 30px;
            background: rgba(255,255,255,.035);
            color: #999;
            transition: .2s;
        }

        .category-btn:hover {
            color: #fff;
            border-color: rgba(255,255,255,.2);
        }

        .category-btn.active {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        /* CONTROLS */

        .catalog-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 35px;
            padding: 0 5% 100px;
            max-width: 1600px;
            margin: auto;
        }

        .filters {
            position: sticky;
            top: 95px;
            align-self: start;
            padding: 22px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 22px;
            background: rgba(255,255,255,.025);
        }

        .filters h3 {
            margin: 0 0 25px;
            font-size: 15px;
        }

        .filter-group {
            padding: 20px 0;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .filter-group:first-of-type {
            border-top: 0;
            padding-top: 0;
        }

        .filter-title {
            margin-bottom: 13px;
            color: #aaa;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 11px 0;
            color: #999;
            font-size: 13px;
            cursor: pointer;
        }

        .filter-option:hover {
            color: #fff;
        }

        .filter-option input {
            accent-color: #fff;
        }

        .catalog-main {
            min-width: 0;
        }

        .catalog-toolbar {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            height: 48px;
            padding: 0 18px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            outline: none;
            background: rgba(255,255,255,.04);
            color: #fff;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .search-box input:focus {
            border-color: rgba(255,255,255,.3);
        }

        .sort-select {
            height: 48px;
            min-width: 190px;
            padding: 0 15px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            outline: none;
            background: #101010;
            color: #fff;
        }

        .result-count {
            margin-bottom: 18px;
            color: #666;
            font-size: 12px;
        }

        /* PRODUCTS */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .product-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
            transition: .3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,.18);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .product-image {
            position: relative;
            height: 285px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at center, rgba(255,255,255,.07), transparent 55%);
        }

        .product-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 5;
            padding: 6px 9px;
            border-radius: 8px;
            background: rgba(255,255,255,.09);
            color: #ccc;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 50%;
            background: rgba(0,0,0,.3);
            color: #777;
            transition: .2s;
        }

        .favorite-btn:hover {
            color: #fff;
            background: rgba(255,255,255,.1);
        }

        .favorite-btn.active {
            color: #fff;
            border-color: rgba(255,255,255,.3);
        }

        .product-visual-link {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PHONE */

        .device {
            position: relative;
            width: 105px;
            height: 210px;
            border: 4px solid #252525;
            border-radius: 22px;
            background: linear-gradient(145deg, #1e1e1e, #090909);
            box-shadow: 0 25px 50px rgba(0,0,0,.6);
            transform: rotate(-3deg);
            transition: .3s;
        }

        .product-card:hover .device {
            transform: rotate(0) scale(1.04);
        }

        .device::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 50%;
            width: 42px;
            height: 10px;
            border-radius: 10px;
            background: #000;
            transform: translateX(-50%);
        }

        .device::after {
            content: "NOVA";
            position: absolute;
            bottom: 17px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #666;
        }

        /* LAPTOP */

        .laptop {
            position: relative;
            width: 205px;
            height: 125px;
            border: 5px solid #252525;
            border-bottom-width: 9px;
            border-radius: 12px 12px 5px 5px;
            background: linear-gradient(145deg, #222, #090909);
            transform: perspective(500px) rotateX(4deg);
            box-shadow: 0 30px 45px rgba(0,0,0,.6);
            transition: .3s;
        }

        .laptop::after {
            content: "";
            position: absolute;
            left: -20px;
            bottom: -17px;
            width: 235px;
            height: 9px;
            border-radius: 0 0 15px 15px;
            background: #292929;
        }

        .product-card:hover .laptop {
            transform: perspective(500px) rotateX(0) scale(1.04);
        }

        /* TABLET */

        .tablet {
            position: relative;
            width: 155px;
            height: 205px;
            border: 5px solid #252525;
            border-radius: 19px;
            background: linear-gradient(145deg, #1d1d1d, #080808);
            box-shadow: 0 25px 50px rgba(0,0,0,.6);
            transform: rotate(-3deg);
            transition: .3s;
        }

        .tablet::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #444;
            transform: translateX(-50%);
        }

        .product-card:hover .tablet {
            transform: rotate(0) scale(1.04);
        }

        /* BUDS */

        .buds {
            position: relative;
            width: 145px;
            height: 100px;
            transition: .3s;
        }

        .buds::before,
        .buds::after {
            content: "";
            position: absolute;
            top: 12px;
            width: 53px;
            height: 68px;
            border-radius: 30px 30px 24px 24px;
            background: linear-gradient(145deg, #292929, #090909);
            box-shadow: 0 20px 40px rgba(0,0,0,.6);
        }

        .buds::before {
            left: 13px;
            transform: rotate(-12deg);
        }

        .buds::after {
            right: 13px;
            transform: rotate(12deg);
        }

        .product-card:hover .buds {
            transform: scale(1.05);
        }

        /* WATCH */

        .watch {
            position: relative;
            width: 115px;
            height: 145px;
            transition: .3s;
        }

        .watch::before {
            content: "";
            position: absolute;
            left: 29px;
            top: 0;
            width: 57px;
            height: 145px;
            border-radius: 28px;
            background: #171717;
            box-shadow: 0 25px 45px rgba(0,0,0,.6);
        }

        .watch::after {
            content: "";
            position: absolute;
            left: 35px;
            top: 32px;
            width: 45px;
            height: 62px;
            border-radius: 14px;
            background: #050505;
            border: 3px solid #2b2b2b;
        }

        .product-card:hover .watch {
            transform: scale(1.05);
        }

        /* ACCESSORY */

        .accessory {
            position: relative;
            width: 145px;
            height: 90px;
            border-radius: 25px;
            background: linear-gradient(145deg, #252525, #090909);
            box-shadow: 0 25px 45px rgba(0,0,0,.6);
            transition: .3s;
        }

        .accessory::after {
            content: "NOVA";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #555;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .product-card:hover .accessory {
            transform: scale(1.05);
        }

        /* PRODUCT INFO */

        .product-info {
            padding: 20px;
        }

        .product-brand {
            margin-bottom: 5px;
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .product-name {
            min-height: 42px;
            margin: 0;
            font-size: 17px;
            line-height: 1.3;
        }

        .product-description {
            min-height: 38px;
            margin: 8px 0 17px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
        }

        .add-cart {
            padding: 11px 14px;
            border: 0;
            border-radius: 11px;
            background: #fff;
            color: #000;
            font-size: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .add-cart:hover {
            transform: translateY(-1px);
            background: #ddd;
        }

        .details-link {
            display: inline-block;
            margin-top: 12px;
            color: #777;
            font-size: 11px;
            transition: .2s;
        }

        .details-link:hover {
            color: #fff;
        }

        /* EMPTY */

        .empty-products {
            display: none;
            padding: 80px 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 22px;
            color: #666;
        }

        .empty-products h3 {
            margin: 0 0 8px;
            color: #fff;
        }

        /* CART PANEL */

        .cart-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            background: rgba(0,0,0,.55);
            backdrop-filter: blur(5px);
        }

        .cart-overlay.open {
            display: block;
        }

        .cart-panel {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 2001;
            width: min(420px, 100%);
            height: 100vh;
            padding: 25px;
            display: flex;
            flex-direction: column;
            background: #0c0c0c;
            border-left: 1px solid rgba(255,255,255,.08);
            transform: translateX(100%);
            transition: .3s ease;
        }

        .cart-panel.open {
            transform: translateX(0);
        }

        .cart-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .cart-head h2 {
            margin: 0;
            font-size: 22px;
        }

        .close-cart {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 50%;
            background: rgba(255,255,255,.04);
            color: #fff;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,.07);
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
        }

        .cart-item-price {
            color: #777;
            font-size: 11px;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cart-quantity button {
            width: 27px;
            height: 27px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 8px;
            background: rgba(255,255,255,.04);
            color: #fff;
        }

        .cart-quantity span {
            min-width: 15px;
            text-align: center;
            font-size: 12px;
        }

        .remove-item {
            border: 0;
            background: none;
            color: #555;
            font-size: 18px;
        }

        .remove-item:hover {
            color: #fff;
        }

        .empty-cart {
            padding: 50px 0;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .cart-footer {
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: 700;
        }

        .open-cart-btn {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 13px;
            background: #fff;
            color: #000;
            font-weight: 700;
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            z-index: 3000;
            padding: 13px 18px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 13px;
            background: #151515;
            color: #fff;
            font-size: 13px;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            transform: translate(-50%, 100px);
            opacity: 0;
            pointer-events: none;
            transition: .3s;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        /* FOOTER */

        footer {
            padding: 60px 5%;
            border-top: 1px solid rgba(255,255,255,.07);
            color: #666;
            text-align: center;
            font-size: 12px;
        }

        /* RESPONSIVE */

        @media (max-width: 1100px) {
            .products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .catalog-layout {
                grid-template-columns: 210px 1fr;
            }
        }

        @media (max-width: 800px) {
            .header-nav {
                display: none;
            }

            .catalog-layout {
                grid-template-columns: 1fr;
            }

            .filters {
                position: static;
            }

            .products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            .catalog-header {
                padding: 0 18px;
            }

            .catalog-hero {
                padding: 80px 20px 55px;
            }

            .catalog-hero h1 {
                letter-spacing: -2px;
            }

            .category-section,
            .catalog-layout {
                padding-left: 18px;
                padding-right: 18px;
            }

            .catalog-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .sort-select {
                width: 100%;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 300px;
            }
        }
    </style>
</head>

<body>

<header class="catalog-header">
    <a href="index.html" class="logo">NOVA</a>

    <nav class="header-nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="about.html">О нас</a>
        <a href="contacts.html">Контакты</a>
    </nav>

    <div class="header-actions">
        <button class="header-action" id="favoritesButton" aria-label="Избранное">
            ♡
            <span class="counter" id="favoritesCount">0</span>
        </button>

        <button class="header-action" id="cartButton" aria-label="Корзина">
            🛒
            <span class="counter" id="cartCount">0</span>
        </button>
    </div>
</header>

<section class="catalog-hero">
    <div class="hero-label">NOVA Store</div>

    <h1>Каталог</h1>

    <p>
        Техника нового поколения. Выбирай устройство,
        которое подходит именно тебе.
    </p>
</section>

<section class="category-section">
    <div class="category-list">
        <button class="category-btn active" data-category="all">
            Все товары
        </button>

        <button class="category-btn" data-category="smartphone">
            Смартфоны
        </button>

        <button class="category-btn" data-category="laptop">
            Ноутбуки
        </button>

        <button class="category-btn" data-category="tablet">
            Планшеты
        </button>

        <button class="category-btn" data-category="audio">
            Аудио
        </button>

        <button class="category-btn" data-category="watch">
            Часы
        </button>

        <button class="category-btn" data-category="accessory">
            Аксессуары
        </button>
    </div>
</section>

<main class="catalog-layout">

    <aside class="filters">

        <h3>Фильтры</h3>

        <div class="filter-group">

            <div class="filter-title">Цена</div>

            <label class="filter-option">
                <input
                    type="checkbox"
                    class="price-filter"
                    data-min="0"
                    data-max="49999"
                >
                До 50 000 ₽
            </label>

            <label class="filter-option">
                <input
                    type="checkbox"
                    class="price-filter"
                    data-min="50000"
                    data-max="100000"
                >
                50 000 — 100 000 ₽
            </label>

            <label class="filter-option">
                <input
                    type="checkbox"
                    class="price-filter"
                    data-min="100001"
                    data-max="Infinity"
                >
                От 100 001 ₽
            </label>

        </div>

        <div class="filter-group">

            <div class="filter-title">Особое</div>

            <label class="filter-option">
                <input type="checkbox" id="newFilter">
                Новинки
            </label>

            <label class="filter-option">
                <input type="checkbox" id="bestFilter">
                Бестселлеры
            </label>

        </div>

        <div class="filter-group">

            <label class="filter-option">
                <input type="checkbox" id="stockFilter" checked>
                В наличии
            </label>

        </div>

    </aside>

    <section class="catalog-main">

        <div class="catalog-toolbar">

            <div class="search-box">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Поиск по каталогу..."
                    autocomplete="off"
                >
            </div>

            <select id="sortSelect" class="sort-select">
                <option value="default">По умолчанию</option>
                <option value="price-asc">Цена: по возрастанию</option>
                <option value="price-desc">Цена: по убыванию</option>
                <option value="name-asc">Название: А–Я</option>
                <option value="name-desc">Название: Я–А</option>
            </select>

        </div>

        <div class="result-count" id="resultCount">
            Товаров: 0
        </div>

        <div class="products-grid" id="productsGrid"></div>

        <div class="empty-products" id="emptyProducts">
            <h3>Ничего не найдено</h3>
            <p>Попробуй изменить запрос или фильтры.</p>
        </div>

    </section>

</main>

<!-- CART -->

<div class="cart-overlay" id="cartOverlay"></div>

<aside class="cart-panel" id="cartPanel">

    <div class="cart-head">
        <h2>Корзина</h2>

        <button class="close-cart" id="closeCart">
            ×
        </button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-footer">

        <div class="cart-total">
            <span>Итого</span>
            <span id="cartTotal">0 ₽</span>
        </div>

        <a href="cart.html">
            <button class="open-cart-btn">
                Перейти в корзину
            </button>
        </a>

    </div>

</aside>

<div class="toast" id="toast"></div>

<footer>
    © 2026 NOVA. Техника. Без компромиссов.
</footer>

<!-- ВАЖНО: сначала products.js, потом код каталога -->
<script src="products.js"></script>

<script>
    /* =========================================================
       NOVA CATALOG
       ========================================================= */

    const productsGrid = document.getElementById("productsGrid");
    const emptyProducts = document.getElementById("emptyProducts");
    const resultCount = document.getElementById("resultCount");

    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    const newFilter = document.getElementById("newFilter");
    const bestFilter = document.getElementById("bestFilter");
    const stockFilter = document.getElementById("stockFilter");

    const cartButton = document.getElementById("cartButton");
    const cartPanel = document.getElementById("cartPanel");
    const cartOverlay = document.getElementById("cartOverlay");
    const closeCart = document.getElementById("closeCart");

    const cartItems = document.getElementById("cartItems");
    const cartTotal = document.getElementById("cartTotal");
    const cartCount = document.getElementById("cartCount");

    const favoritesButton = document.getElementById("favoritesButton");
    const favoritesCount = document.getElementById("favoritesCount");

    const toast = document.getElementById("toast");


    /* =========================================================
       DATA
       ========================================================= */

    const productArray = Object.entries(products).map(([id, product]) => ({
        id,
        ...product
    }));


    /* =========================================================
       STATE
       ========================================================= */

    let selectedCategory = "all";
    let searchQuery = "";

    let cart = readCart();
    let favorites = readFavorites();


    /* =========================================================
       HELPERS
       ========================================================= */

    function formatPrice(price) {
        return new Intl.NumberFormat("ru-RU").format(Number(price) || 0) + " ₽";
    }


    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function readCart() {
        try {
            const saved = JSON.parse(localStorage.getItem("novaCart"));

            if (!Array.isArray(saved)) {
                return [];
            }

            return saved
                .map(item => ({
                    id: String(item.id || ""),
                    quantity: Math.max(1, Number(item.quantity) || 1)
                }))
                .filter(item => item.id);

        } catch (error) {
            return [];
        }
    }


    function saveCart() {
        localStorage.setItem(
            "novaCart",
            JSON.stringify(cart)
        );
    }


    function readFavorites() {
        try {
            const saved = JSON.parse(
                localStorage.getItem("novaFavorites")
            );

            return Array.isArray(saved)
                ? saved.map(String)
                : [];

        } catch (error) {
            return [];
        }
    }


    function saveFavorites() {
        localStorage.setItem(
            "novaFavorites",
            JSON.stringify(favorites)
        );
    }


    function getProduct(id) {
        return products[id] || null;
    }


    function getCartQuantity() {
        return cart.reduce(
            (total, item) => total + item.quantity,
            0
        );
    }


    function getCartTotal() {
        return cart.reduce((total, item) => {

            const product = getProduct(item.id);

            if (!product) {
                return total;
            }

            return total +
                (Number(product.price) || 0) *
                item.quantity;

        }, 0);
    }


    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(showToast.timer);

        showToast.timer = setTimeout(() => {
            toast.classList.remove("show");
        }, 1800);
    }


    /* =========================================================
       VISUAL
       ========================================================= */

    function getVisualClass(category) {

        const classes = {
            smartphone: "device",
            laptop: "laptop",
            tablet: "tablet",
            audio: "buds",
            watch: "watch",
            accessory: "accessory"
        };

        return classes[category] || "accessory";
    }


    /* =========================================================
       PRODUCT CARD
       ========================================================= */

    function createProductCard(product) {

        const favoriteActive =
            favorites.includes(String(product.id));

        const badge =
            product.badge
                ? `<div class="product-badge">${escapeHtml(product.badge)}</div>`
                : "";

        const description =
            product.description ||
            "Премиальное устройство NOVA.";


        return `
            <article class="product-card">

                <div class="product-image">

                    ${badge}

                    <button
                        class="favorite-btn ${favoriteActive ? "active" : ""}"
                        data-favorite="${escapeHtml(product.id)}"
                        aria-label="Добавить в избранное"
                    >
                        ${favoriteActive ? "♥" : "♡"}
                    </button>

                    <a
                        class="product-visual-link"
                        href="product.html?id=${encodeURIComponent(product.id)}"
                    >
                        <div class="${getVisualClass(product.category)}"></div>
                    </a>

                </div>

                <div class="product-info">

                    <div class="product-brand">
                        ${escapeHtml(product.brand || "NOVA")}
                    </div>

                    <h2 class="product-name">
                        ${escapeHtml(product.name)}
                    </h2>

                    <p class="product-description">
                        ${escapeHtml(description)}
                    </p>

                    <div class="product-bottom">

                        <div class="product-price">
                            ${formatPrice(product.price)}
                        </div>

                        <button
                            class="add-cart"
                            data-add-cart="${escapeHtml(product.id)}"
                        >
                            В корзину
                        </button>

                    </div>

                    <a
                        class="details-link"
                        href="product.html?id=${encodeURIComponent(product.id)}"
                    >
                        Подробнее →
                    </a>

                </div>

            </article>
        `;
    }


    /* =========================================================
       FILTERS
       ========================================================= */

    function matchesPrice(product) {

        const filters = [
            ...document.querySelectorAll(".price-filter:checked")
        ];

        if (filters.length === 0) {
            return true;
        }

        const price = Number(product.price) || 0;

        return filters.some(filter => {

            const min = Number(filter.dataset.min);

            const max =
                filter.dataset.max === "Infinity"
                    ? Infinity
                    : Number(filter.dataset.max);

            return price >= min && price <= max;
        });
    }


    function matchesSpecialFilters(product) {

        const badge =
            String(product.badge || "").toUpperCase();


        if (
            newFilter.checked &&
            !(
                badge.includes("NEW") ||
                badge.includes("НОВ")
            )
        ) {
            return false;
        }


        if (
            bestFilter.checked &&
            !(
                badge.includes("BEST") ||
                badge.includes("ХИТ") ||
                badge.includes("Bestseller".toUpperCase())
            )
        ) {
            return false;
        }


        if (
            stockFilter.checked &&
            product.stock === false
        ) {
            return false;
        }


        return true;
    }


    function getFilteredProducts() {

        let result = [...productArray];


        /* CATEGORY */

        if (selectedCategory !== "all") {

            result = result.filter(product =>
                product.category === selectedCategory
            );
        }


        /* SEARCH */

        if (searchQuery.trim()) {

            const query =
                searchQuery
                    .trim()
                    .toLowerCase();

            result = result.filter(product => {

                const searchable = [
                    product.name,
                    product.brand,
                    product.description,
                    product.category,
                    product.badge
                ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                return searchable.includes(query);
            });
        }


        /* PRICE */

        result = result.filter(matchesPrice);


        /* SPECIAL */

        result = result.filter(matchesSpecialFilters);


        /* SORT */

        switch (sortSelect.value) {

            case "price-asc":
                result.sort(
                    (a, b) =>
                        Number(a.price) - Number(b.price)
                );
                break;

            case "price-desc":
                result.sort(
                    (a, b) =>
                        Number(b.price) - Number(a.price)
                );
                break;

            case "name-asc":
                result.sort(
                    (a, b) =>
                        String(a.name).localeCompare(
                            String(b.name),
                            "ru"
                        )
                );
                break;

            case "name-desc":
                result.sort(
                    (a, b) =>
                        String(b.name).localeCompare(
                            String(a.name),
                            "ru"
                        )
                );
                break;
        }


        return result;
    }


    /* =========================================================
       RENDER PRODUCTS
       ========================================================= */

    function renderProducts() {

        const result =
            getFilteredProducts();


        resultCount.textContent =
            `Товаров: ${result.length}`;


        if (result.length === 0) {

            productsGrid.innerHTML = "";

            emptyProducts.style.display = "block";

            return;
        }


        emptyProducts.style.display = "none";


        productsGrid.innerHTML =
            result
                .map(createProductCard)
                .join("");
    }


    /* =========================================================
       CART
       ========================================================= */

    function addToCart(id) {

        const product = getProduct(id);

        if (!product) {
            showToast("Товар не найден");
            return;
        }


        const existing =
            cart.find(item => item.id === String(id));


        if (existing) {

            existing.quantity += 1;

        } else {

            cart.push({
                id: String(id),
                quantity: 1
            });
        }


        saveCart();

        updateCartUI();

        showToast(
            `${product.name} добавлен в корзину ✓`
        );
    }


    function changeCartQuantity(id, change) {

        const item =
            cart.find(item => item.id === String(id));


        if (!item) {
            return;
        }


        item.quantity += change;


        if (item.quantity <= 0) {

            cart =
                cart.filter(
                    cartItem =>
                        cartItem.id !== String(id)
                );
        }


        saveCart();

        updateCartUI();
    }


    function removeFromCart(id) {

        cart =
            cart.filter(
                item =>
                    item.id !== String(id)
            );


        saveCart();

        updateCartUI();

        showToast("Товар удалён");
    }


    function renderCart() {

        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty-cart">
                    Корзина пока пустая
                </div>
            `;

            cartTotal.textContent = "0 ₽";

            return;
        }


        cartItems.innerHTML =
            cart.map(item => {

                const product =
                    getProduct(item.id);


                if (!product) {
                    return "";
                }


                return `
                    <div class="cart-item">

                        <div class="cart-item-info">

                            <div class="cart-item-name">
                                ${escapeHtml(product.name)}
                            </div>

                            <div class="cart-item-price">
                                ${formatPrice(product.price)}
                            </div>

                        </div>

                        <div class="cart-quantity">

                            <button
                                data-cart-minus="${escapeHtml(product.id)}"
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                data-cart-plus="${escapeHtml(product.id)}"
                            >
                                +
                            </button>

                        </div>

                        <button
                            class="remove-item"
                            data-cart-remove="${escapeHtml(product.id)}"
                            aria-label="Удалить"
                        >
                            ×
                        </button>

                    </div>
                `;

            }).join("");


        cartTotal.textContent =
            formatPrice(getCartTotal());
    }


    function updateCartUI() {

        cartCount.textContent =
            getCartQuantity();

        renderCart();
    }


    /* =========================================================
       FAVORITES
       ========================================================= */

    function toggleFavorite(id) {

        id = String(id);


        if (favorites.includes(id)) {

            favorites =
                favorites.filter(
                    favoriteId =>
                        favoriteId !== id
                );

            showToast("Удалено из избранного");

        } else {

            favorites.push(id);

            showToast("Добавлено в избранное ✓");
        }


        saveFavorites();

        updateFavoritesUI();

        renderProducts();
    }


    function updateFavoritesUI() {

        favoritesCount.textContent =
            favorites.length;
    }


    /* =========================================================
       CART OPEN / CLOSE
       ========================================================= */

    function openCart() {

        cartPanel.classList.add("open");
        cartOverlay.classList.add("open");

        document.body.style.overflow = "hidden";
    }


    function closeCartPanel() {

        cartPanel.classList.remove("open");
        cartOverlay.classList.remove("open");

        document.body.style.overflow = "";
    }


    cartButton.addEventListener(
        "click",
        openCart
    );


    closeCart.addEventListener(
        "click",
        closeCartPanel
    );


    cartOverlay.addEventListener(
        "click",
        closeCartPanel
    );


    /* =========================================================
       PRODUCT EVENTS
       ========================================================= */

    productsGrid.addEventListener(
        "click",
        function(event) {

            const addButton =
                event.target.closest("[data-add-cart]");


            if (addButton) {

                event.preventDefault();

                addToCart(
                    addButton.dataset.addCart
                );

                return;
            }


            const favoriteButton =
                event.target.closest("[data-favorite]");


            if (favoriteButton) {

                event.preventDefault();
                event.stopPropagation();

                toggleFavorite(
                    favoriteButton.dataset.favorite
                );
            }

        }
    );


    /* =========================================================
       CART EVENTS
       ========================================================= */

    cartItems.addEventListener(
        "click",
        function(event) {

            const plus =
                event.target.closest("[data-cart-plus]");

            const minus =
                event.target.closest("[data-cart-minus]");

            const remove =
                event.target.closest("[data-cart-remove]");


            if (plus) {

                changeCartQuantity(
                    plus.dataset.cartPlus,
                    1
                );

                return;
            }


            if (minus) {

                changeCartQuantity(
                    minus.dataset.cartMinus,
                    -1
                );

                return;
            }


            if (remove) {

                removeFromCart(
                    remove.dataset.cartRemove
                );
            }

        }
    );


    /* =========================================================
       CATEGORIES
       ========================================================= */

    document
        .querySelectorAll(".category-btn")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(".category-btn")
                        .forEach(btn =>
                            btn.classList.remove("active")
                        );


                    this.classList.add("active");


                    selectedCategory =
                        this.dataset.category;


                    renderProducts();
                }
            );

        });


    /* =========================================================
       SEARCH
       ========================================================= */

    searchInput.addEventListener(
        "input",
        function() {

            searchQuery =
                this.value;

            renderProducts();
        }
    );


    /* =========================================================
       SORT
       ========================================================= */

    sortSelect.addEventListener(
        "change",
        renderProducts
    );


    /* =========================================================
       FILTERS
       ========================================================= */

    document
        .querySelectorAll(".price-filter")
        .forEach(filter => {

            filter.addEventListener(
                "change",
                renderProducts
            );

        });


    newFilter.addEventListener(
        "change",
        renderProducts
    );


    bestFilter.addEventListener(
        "change",
        renderProducts
    );


    stockFilter.addEventListener(
        "change",
        renderProducts
    );


    /* =========================================================
       FAVORITES BUTTON
       ========================================================= */

    favoritesButton.addEventListener(
        "click",
        function() {

            if (favorites.length === 0) {

                showToast("Избранное пока пустое");

                return;
            }


            showToast(
                `В избранном: ${favorites.length}`
            );
        }
    );


    /* =========================================================
       INITIALIZE
       ========================================================= */

    updateCartUI();
    updateFavoritesUI();
    renderProducts();

</script>

</body>
</html>
